<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phill Console | Admin Control</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght=300;400;500&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="module" id="firebase-init">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADaeEPaUvLyU6J8eIPIy9luNeDhizxg-Q",
    authDomain: "phill-bar.firebaseapp.com",
    projectId: "phill-bar",
    storageBucket: "phill-bar.firebasestorage.app",
    messagingSenderId: "298800907820",
    appId: "1:298800907820:web:98b360862cf2b0c6deb389",
    measurementId: "G-BHQEZYV429"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.__firestore = {
    db, auth,
    collection, addDoc, getDocs, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy
  };
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<script>
tailwind.config = {
  theme: { extend: { colors: { jazzBlack: '#060202', jazzCard: '#120A0A', jazzRed: '#FF2A1A', jazzOrange: '#FFA100' } } }
}
</script>
</head>
<body class="bg-jazzBlack text-zinc-300 font-sans min-h-screen p-6 flex items-center justify-center">
<div id="root" class="w-full max-w-4xl h-[90vh]"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const PASS_KEY = "phillbar77";

function AdminApp() {
  const [firebaseReady, setFirebaseReady] = useState(!!window.__firestore);
  const [isAuthed, setIsAuthed] = useState(false);
  const [passInput, setPassInput] = useState('');
  const [feeds, setFeeds] = useState([]);
  const [loading, setLoading] = useState(false);

  const [isEdit, setIsEdit] = useState(false);
  const [editId, setEditId] = useState(null);
  const [title, setTitle] = useState('');
  const [artist, setArtist] = useState('');
  const [images, setImages] = useState('');
  const [members, setMembers] = useState('');
  const [bio, setBio] = useState('');

  // 🛠️ 유튜브 연동 제어를 위한 상태 필드 추가
  const [youtubeId, setYoutubeId] = useState('');
  const [startTime, setStartTime] = useState('');
  const [endTime, setEndTime] = useState('');

  useEffect(() => {
    if (!firebaseReady) {
      window.addEventListener('firebase-ready', () => setFirebaseReady(true), { once: true });
    }
  }, []);

  const loadFeeds = useCallback(async () => {
    if (!window.__firestore) return;
    const { db, collection, query, orderBy, getDocs } = window.__firestore;
    setLoading(true);
    try {
      const q = query(collection(db, 'feeds'), orderBy('createdAt', 'desc'));
      const snapshot = await getDocs(q);
      const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      setFeeds(data);
    } catch(e) {
      console.error(e);
    }
    setLoading(false);
  }, []);

  useEffect(() => {
    if (isAuthed && firebaseReady) loadFeeds();
  }, [isAuthed, firebaseReady]);

  const handleLogin = (e) => {
    e.preventDefault();
    if (passInput === PASS_KEY) setIsAuthed(true);
    else alert('인증 토큰이 유효하지 않습니다.');
  };

  const handleSave = async (e) => {
    e.preventDefault();
    if (!title && !images && !bio && !youtubeId) {
      alert('최소한 제목, 이미지, 유튜브 링크, 또는 설명 중 하나는 입력해주세요.');
      return;
    }
    const { db, collection, addDoc, doc, updateDoc, serverTimestamp } = window.__firestore;
    setLoading(true);

    // 파이어베이스에 바인딩할 데이터 객체 구조 정제
    const feedPayload = {
      title,
      artistName: artist,
      coverImage: images,
      members,
      bio,
      youtubeId: youtubeId.trim() || null,
      startTime: startTime ? Number(startTime) : 0,
      endTime: endTime ? Number(endTime) : 0
    };

    try {
      if (isEdit) {
        await updateDoc(doc(db, 'feeds', editId), feedPayload);
        alert('수정 완료되었습니다.');
      } else {
        await addDoc(collection(db, 'feeds'), {
          ...feedPayload,
          comments: [],
          createdAt: serverTimestamp()
        });
        alert('새 피드가 발행되었습니다.');
      }
      await loadFeeds();
      clearForm();
    } catch(e) {
      alert('저장 실패: ' + e.message);
    }
    setLoading(false);
  };

  const startEdit = (f) => {
    setIsEdit(true); 
    setEditId(f.id); 
    setTitle(f.title || '');
    setArtist(f.artistName || ''); 
    setImages(f.coverImage || '');
    setMembers(f.members || ''); 
    setBio(f.bio || '');
    
    // 수정 활성화 시 유튜브 관련 데이터 폼 로드
    setYoutubeId(f.youtubeId || '');
    setStartTime(f.startTime !== undefined ? f.startTime : '');
    setEndTime(f.endTime !== undefined ? f.endTime : '');
  };

  const handleDelete = async (id) => {
    if (!window.confirm('이 피드를 영구 삭제합니까?')) return;
    const { db, doc, deleteDoc } = window.__firestore;
    setLoading(true);
    try {
      await deleteDoc(doc(db, 'feeds', id));
      await loadFeeds();
    } catch(e) {
      alert('삭제 실패: ' + e.message);
    }
    setLoading(false);
  };

  const clearForm = () => {
    setIsEdit(false); 
    setEditId(null); 
    setTitle(''); 
    setArtist('');
    setImages(''); 
    setMembers(''); 
    setBio('');
    setYoutubeId('');
    setStartTime('');
    setEndTime('');
  };

  if (!firebaseReady) {
    return <div className="w-full h-full flex items-center justify-center text-zinc-500 text-xs tracking-widest">CONNECTING...</div>;
  }

  if (!isAuthed) {
    return (
      <div className="w-full h-full flex items-center justify-center">
        <form onSubmit={handleLogin} className="bg-jazzCard p-8 rounded-2xl border border-zinc-800 w-full max-w-sm text-center space-y-4 shadow-xl">
          <h2 className="text-xs tracking-[0.2em] text-white uppercase font-light">CONSOLES KEY VERIFICATION</h2>
          <input type="password" placeholder="Security Password" value={passInput} onChange={e=>setPassInput(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded py-2 text-xs text-center text-white focus:outline-none focus:border-jazzRed" />
          <button type="submit" className="w-full bg-jazzRed text-white text-xs py-2 rounded tracking-widest hover:bg-red-700">ACCESS CONTROL</button>
        </form>
      </div>
    );
  }

  return (
    <div className="bg-jazzCard border border-zinc-800 rounded-2xl p-6 w-full h-full flex flex-col md:flex-row gap-6 shadow-2xl">
      {/* 에디터 폼 */}
      <form onSubmit={handleSave} className="w-full md:w-1/2 flex flex-col justify-between space-y-3 overflow-y-auto pr-2 feed-scroll-container">
        <div className="space-y-3">
          <h2 className="text-xs text-jazzOrange font-medium tracking-widest uppercase">{isEdit ? "Modify Station" : "Publish New Feed"}</h2>
          <input type="text" placeholder="피드 제목 (공란 가능)" value={title} onChange={e=>setTitle(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-white focus:outline-none focus:border-jazzRed" />
          <input type="text" placeholder="아티스트 소속 명칭" value={artist} onChange={e=>setArtist(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-white focus:outline-none" />
          <input type="text" placeholder="멤버 세션 구성원 정보" value={members} onChange={e=>setMembers(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-white focus:outline-none" />
          
          <div className="bg-zinc-950 p-2 rounded border border-zinc-900 space-y-1.5">
            <label className="text-[10px] text-zinc-500 block">이미지 소스 주소 URL (다중 업로드는 엔터 줄바꿈 구분, 공란 시 텍스트 전용 전환)</label>
            <textarea rows="2" placeholder={"https://example.com/image1.jpg\nhttps://example.com/image2.jpg"} value={images} onChange={e=>setImages(e.target.value)} className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-[11px] text-zinc-300 focus:outline-none"></textarea>
          </div>

          {/* 🛠️ 추가됨: 유튜브 비디오 제어 콘솔 섹션 */}
          <div className="bg-zinc-950 p-3 rounded border border-zinc-900 space-y-2">
            <label className="text-[10px] text-jazzOrange block font-medium tracking-wide"><i className="fa-brands fa-youtube mr-1"></i> YouTube 무한 루프 하이라이트 설정</label>
            <input 
              type="text" 
              placeholder="유튜브 11자리 고유 ID만 입력 (예: WvNpPr4Mk8U)" 
              value={youtubeId} 
              onChange={e=>setYoutubeId(e.target.value)} 
              className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-xs text-white focus:outline-none focus:border-jazzOrange font-light" 
            />
            <div className="flex gap-2">
              <div className="w-1/2 space-y-1">
                <span className="text-[9px] text-zinc-500 pl-0.5">시작 시점 (초 단위 입력)</span>
                <input 
                  type="number" 
                  placeholder="예: 30" 
                  value={startTime} 
                  onChange={e=>setStartTime(e.target.value)} 
                  className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-xs text-white focus:outline-none" 
                  min="0"
                />
              </div>
              <div className="w-1/2 space-y-1">
                <span className="text-[9px] text-zinc-500 pl-0.5">종료 시점 (초 단위 입력)</span>
                <input 
                  type="number" 
                  placeholder="예: 75" 
                  value={endTime} 
                  onChange={e=>setEndTime(e.target.value)} 
                  className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-xs text-white focus:outline-none" 
                  min="0"
                />
              </div>
            </div>
          </div>

          <textarea rows="4" placeholder="설명 본문 텍스트란 입력 (공란 가능)" value={bio} onChange={e=>setBio(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-white focus:outline-none"></textarea>
        </div>
        
        <div className="flex gap-2 pt-2">
          {isEdit && <button type="button" onClick={clearForm} className="w-1/4 bg-zinc-800 text-xs rounded text-zinc-400">취소</button>}
          <button type="submit" disabled={loading} className="flex-1 bg-jazzRed text-white text-xs py-2 rounded font-medium tracking-wider disabled:opacity-50">
            {loading ? '처리 중...' : (isEdit ? "수정 반영하기" : "바에 즉시 발행하기")}
          </button>
        </div>
      </form>

      {/* 실시간 보드 현황 */}
      <div className="w-full md:w-1/2 flex flex-col border-t md:border-t-0 md:border-l border-zinc-900 md:pl-6 pt-4 md:pt-0 overflow-hidden">
        <div className="flex items-center justify-between mb-3">
          <h2 className="text-xs text-zinc-500 tracking-widest uppercase">Current Board Feeds ({feeds.length})</h2>
          <button onClick={loadFeeds} disabled={loading} className="text-[10px] text-zinc-600 hover:text-jazzOrange transition">↻ 새로고침</button>
        </div>
        <div className="flex-1 overflow-y-auto space-y-2 feed-scroll-container">
          {loading && feeds.length === 0 && <p className="text-xs text-zinc-600 text-center pt-10">불러오는 중...</p>}
          {feeds.map(f => {
            const imgs = f.coverImage ? f.coverImage.split('\n').filter(Boolean) : [];
            const isVideoFeed = !!f.youtubeId;

            return (
              <div key={f.id} className="bg-zinc-950 p-3 rounded-lg flex items-center justify-between border border-zinc-900">
                <div className="flex items-center space-x-3 overflow-hidden">
                  {isVideoFeed ? (
                    /* 유튜브 피드 전용 썸네일 표시 배지 */
                    <div className="w-9 h-9 bg-red-950/40 border border-red-900/50 rounded flex flex-col items-center justify-center text-[7px] text-red-500 font-bold">
                      <i className="fa-brands fa-youtube text-xs mb-0.5"></i>LIVE
                    </div>
                  ) : imgs.length > 0 ? (
                    <img src={imgs[0]} className="w-9 h-9 object-cover rounded bg-zinc-900" />
                  ) : (
                    <div className="w-9 h-9 bg-zinc-900 border border-zinc-800 rounded flex items-center justify-center text-[8px] text-zinc-600">TEXT</div>
                  )}
                  <div className="overflow-hidden">
                    <div className="flex items-center gap-1.5">
                      <h4 className="text-xs text-white font-medium truncate capitalize">{f.title || 'Untitled'}</h4>
                      {isVideoFeed && <span className="text-[8px] bg-zinc-800 text-jazzOrange px-1 rounded font-mono">{f.startTime}s-{f.endTime}s</span>}
                    </div>
                    <p className="text-[10px] text-zinc-500 truncate">{f.artistName || 'No Name'}</p>
                  </div>
                </div>
                <div className="flex space-x-2 text-[11px] text-zinc-500">
                  <button onClick={() => startEdit(f)} className="hover:text-jazzOrange transition">수정</button>
                  <button onClick={() => handleDelete(f.id)} className="hover:text-jazzRed transition">삭제</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
