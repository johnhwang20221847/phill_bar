<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phill | Online Jazzbar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, arrayUnion, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADaeEPaUvLyU6J8eIPIy9luNeDhizxg-Q",
    authDomain: "phill-bar.firebaseapp.com",
    projectId: "phill-bar",
    storageBucket: "phill-bar.firebasestorage.app",
    messagingSenderId: "298800907820",
    appId: "1:298800907820:web:98b360862cf2b0c6deb389",
    measurementId: "G-BHQEZYV429"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.__firestore = { db, collection, onSnapshot, query, orderBy, doc, updateDoc, arrayUnion, addDoc };
  window.__auth = { auth, onAuthStateChanged };
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<style>
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #FF2A1A; border-radius: 4px; }
  .feed-scroll-container { scrollbar-width: thin; scrollbar-color: #FF2A1A transparent; }
</style>
</head>
<body class="bg-[#060202] text-zinc-300 font-sans min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [activeTab, setActiveTab] = useState('archive');
  const [feeds, setFeeds] = useState([]);
  const [picks, setPicks] = useState([]);
  const [user, setUser] = useState(null);

  useEffect(() => {
    const { db, collection, query, orderBy, onSnapshot } = window.__firestore;
    const { onAuthStateChanged, auth } = window.__auth;

    const unsubFeeds = onSnapshot(query(collection(db, 'feeds'), orderBy('createdAt', 'desc')), (snapshot) => {
      setFeeds(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
    });

    const unsubPicks = onSnapshot(query(collection(db, 'music_picks'), orderBy('createdAt', 'desc')), (snapshot) => {
      setPicks(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
    });

    onAuthStateChanged(auth, (u) => setUser(u));
    return () => { unsubFeeds(); unsubPicks(); };
  }, []);

  const handleRate = async (pickId, score) => {
    if (!user) return alert("로그인 후 평점을 매겨주세요.");
    const { db, doc, updateDoc, arrayUnion } = window.__firestore;
    await updateDoc(doc(db, 'music_picks', pickId), {
      ratings: arrayUnion({ user: user.email, score: score })
    });
  };

  return (
    <div className="flex flex-col h-screen">
      <header className="p-6 text-center border-b border-zinc-900">
        <h1 className="text-xl tracking-[0.3em] text-white">PHILL</h1>
        <nav className="flex justify-center gap-6 mt-4">
          {['archive', 'lounge', 'picks'].map(tab => (
            <button key={tab} onClick={() => setActiveTab(tab)} className={`text-[10px] uppercase tracking-widest ${activeTab === tab ? 'text-jazzRed' : 'text-zinc-600'}`}>
              {tab}
            </button>
          ))}
        </nav>
      </header>

      <main className="flex-1 overflow-hidden flex justify-center p-4">
        <div className="w-full max-w-[980px] bg-[#120A0A]/60 rounded-2xl border border-zinc-800 flex flex-col overflow-hidden">
          
          {/* ARCHIVE 탭 */}
          <div className={`flex-1 p-6 ${activeTab === 'archive' ? 'block' : 'hidden'}`}>
             <div className="grid grid-cols-2 gap-4 overflow-y-auto h-full">
               {feeds.map(f => <div key={f.id} className="aspect-square bg-zinc-900 rounded-lg flex items-center justify-center text-xs">{f.title}</div>)}
             </div>
          </div>

          {/* LOUNGE 탭 */}
          <div className={`flex-1 p-6 ${activeTab === 'lounge' ? 'block' : 'hidden'}`}>
             <div className="text-zinc-500 text-xs">준비 중인 라운지 공간입니다...</div>
          </div>

          {/* PICKS 탭 */}
          <div className={`flex-1 p-6 ${activeTab === 'picks' ? 'block' : 'hidden'}`}>
            <div className="space-y-4 overflow-y-auto h-full">
              {picks.map(p => {
                const ratings = p.ratings || [];
                const avg = ratings.length > 0 ? (ratings.reduce((a, b) => a + b.score, 0) / ratings.length).toFixed(1) : 0;
                return (
                  <div key={p.id} className="bg-zinc-950 p-4 rounded-xl border border-zinc-800">
                    <p className="text-white text-sm">{p.title}</p>
                    <p className="text-[10px] text-zinc-500 mb-2">{p.artist}</p>
                    <div className="flex items-center gap-3">
                      <div className="flex">
                        {[1,2,3,4,5].map(s => (
                          <button key={s} onClick={() => handleRate(p.id, s)} className="text-jazzOrange/70 hover:text-jazzOrange">
                            <i className="fa-star fa-solid text-[10px] mr-1"></i>
                          </button>
                        ))}
                      </div>
                      <span className="text-[10px] text-zinc-400">평점: {avg}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
