<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phill | Online Jazzbar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, updateDoc, onSnapshot, query, orderBy, arrayUnion, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADaeEPaUvLyU6J8eIPIy9luNeDhizxg-Q",
    authDomain: "phill-bar.firebaseapp.com",
    projectId: "phill-bar",
    storageBucket: "phill-bar.firebasestorage.app",
    messagingSenderId: "298800907820",
    appId: "1:298800907820:web:98b360862cf2b0c6deb389",
    measurementId: "G-BHQEZYV429"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.__firestore = { db, collection, doc, updateDoc, onSnapshot, query, orderBy, arrayUnion, addDoc };
  window.__auth = { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail };
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<style>
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #FF2A1A; border-radius: 4px; }
.feed-scroll-container { scrollbar-width: thin; scrollbar-color: #FF2A1A transparent; }
</style>
</head>
<body class="bg-black text-zinc-300 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// [Music Pick 컴포넌트]
function MusicPick() {
    const [musicList, setMusicList] = useState([]);

    useEffect(() => {
        const { db, collection, onSnapshot, query, orderBy } = window.__firestore;
        const q = query(collection(db, 'music_picks'), orderBy('createdAt', 'desc'));
        const unsubscribe = onSnapshot(q, (snapshot) => {
            const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            setMusicList(data);
        });
        return () => unsubscribe();
    }, []);

    return (
        <div className="p-6 h-full overflow-y-auto feed-scroll-container">
            <h2 className="text-xs uppercase tracking-[0.2em] text-zinc-500 mb-6">Music Picks</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {musicList.map(item => (
                    <div key={item.id} className="bg-zinc-900/50 p-4 rounded border border-zinc-800 hover:border-zinc-600 transition">
                        <h3 className="text-sm font-medium text-white truncate">{item.title}</h3>
                        <p className="text-[10px] text-zinc-500 uppercase tracking-wider">{item.artist}</p>
                        <div className="mt-3 flex items-center justify-between">
                            <span className="text-[10px] text-yellow-500">★ {item.rating || 0}</span>
                            <a href={item.youtubeUrl} target="_blank" className="text-[9px] underline text-zinc-600 hover:text-white">LISTEN</a>
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );
}

function App() {
    const [activeTab, setActiveTab] = useState('archive'); // 'archive', 'lounge', 'picks'

    return (
        <div className="min-h-screen flex flex-col">
            {/* 헤더 */}
            <header className="p-6 border-b border-zinc-900 flex justify-between items-center">
                <h1 className="text-xl font-light tracking-[0.3em] text-white">PHILL</h1>
                <nav className="flex gap-6 text-[10px] uppercase tracking-widest text-zinc-500">
                    <button onClick={() => setActiveTab('archive')} className={activeTab === 'archive' ? 'text-white' : ''}>Archive</button>
                    <button onClick={() => setActiveTab('lounge')} className={activeTab === 'lounge' ? 'text-white' : ''}>Lounge</button>
                    <button onClick={() => setActiveTab('picks')} className={activeTab === 'picks' ? 'text-white' : ''}>Music Pick</button>
                </nav>
            </header>

            {/* 메인 콘텐츠 */}
            <main className="flex-1">
                {activeTab === 'archive' && <div className="p-6">Archive Content (기존 기능)</div>}
                {activeTab === 'lounge' && <div className="p-6">Lounge Content (기존 기능)</div>}
                {activeTab === 'picks' && <MusicPick />}
            </main>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
