<body class="bg-jazzBlack text-zinc-300 font-sans min-h-screen relative flex flex-col justify-between overflow-x-hidden">
<div id="root" class="w-full min-h-screen flex flex-col justify-between z-10"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

function StarRating({ value, onChange, readonly = false, size = 'md' }) {
  const [hovered, setHovered] = useState(0);
  const sizeClass = size === 'sm' ? 'text-xs' : size === 'lg' ? 'text-xl' : 'text-sm';
  return (
    <div className="flex gap-0.5">
      {[1,2,3,4,5].map(n => (
        <button key={n} type="button" disabled={readonly}
          className={`star-btn ${sizeClass} ${readonly ? 'cursor-default' : 'cursor-pointer'}`}
          style={{ color: n<=(hovered||value)?'#D4A843':'#3f3f46', background:'none', border:'none', padding:0 }}
          onMouseEnter={()=>!readonly&&setHovered(n)}
          onMouseLeave={()=>!readonly&&setHovered(0)}
          onClick={()=>!readonly&&onChange&&onChange(n)}
        >
          <i className="fa-solid fa-star"></i>
        </button>
      ))}
    </div>
  );
}

const GENRE_COLORS = {
  'Jazz':'#FFA100','Classical':'#D4A843','Blues':'#4A9EBF','R&B':'#C084FC',
  'Soul':'#F97316','Bossa Nova':'#34D399','Lo-fi':'#94A3B8','Pop':'#F472B6',
  'Rock':'#EF4444','Electronic':'#22D3EE','Hip-hop':'#A78BFA','Folk':'#86EFAC','Other':'#6B7280',
};
const GENRES = Object.keys(GENRE_COLORS);

function MusicCard({ item, onOpen }) {
  const avg = item.ratings?.length
    ? (item.ratings.reduce((s,r)=>s+r.score,0)/item.ratings.length).toFixed(1)
    : null;
  const genreColor = GENRE_COLORS[item.genre]||'#6B7280';
  return (
    <div onClick={()=>onOpen(item)} className="lounge-card-hover bg-zinc-950/60 rounded-xl border border-zinc-800/50 p-3.5 cursor-pointer flex gap-3 items-start">
      <div className="w-14 h-14 flex-shrink-0 rounded-lg overflow-hidden bg-zinc-900 flex items-center justify-center">
        {item.coverUrl
          ? <img src={item.coverUrl} className="w-full h-full object-cover" alt="cover" />
          : <i className="fa-solid fa-music text-zinc-700 text-lg"></i>}
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 mb-0.5">
          <span className="genre-tag" style={{ background:genreColor+'22', color:genreColor, border:`1px solid ${genreColor}44`}}>{item.genre||'Other'}</span>
        </div>
        <h3 className="text-[13px] font-medium text-white truncate">{item.title}</h3>
        <p className="text-[11px] text-zinc-500 font-light truncate">{item.artist}</p>
        <div className="flex items-center gap-2 mt-1.5">
          <StarRating value={Math.round(avg||0)} readonly size="sm" />
          <span className="text-[10px] text-zinc-500 font-light">
            {avg ? `${avg} (${item.ratings.length}개)` : '아직 평가 없음'}
          </span>
        </div>
      </div>
      <div className="flex flex-col items-end gap-1 flex-shrink-0">
        <span className="text-[9px] text-zinc-600 font-light uppercase tracking-wider">Reviews</span>
        <span className="text-sm font-light text-zinc-400">{(item.reviews||[]).length}</span>
      </div>
    </div>
  );
}

function MusicDetailModal({ item, user, onClose, onRate, onReview, onEditReview, onDeleteReview, currentUsername }) {
  const [myRating, setMyRating] = useState(0);
  const [reviewText, setReviewText] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [editingReview, setEditingReview] = useState(false);
  const [editReviewText, setEditReviewText] = useState('');
  const [editRating, setEditRating] = useState(0);

  useEffect(() => {
    if (user && item.ratings) {
      const mine = item.ratings.find(r=>r.user===currentUsername);
      if (mine) setMyRating(mine.score);
    }
    if (user && item.reviews) {
      const mine = item.reviews.find(r=>r.user===currentUsername);
      if (mine) { setEditReviewText(mine.text); setEditRating(mine.score||0); }
    }
  }, [item, user, currentUsername]);

  const avg = item.ratings?.length ? item.ratings.reduce((s,r)=>s+r.score,0)/item.ratings.length : 0;
  const genreColor = GENRE_COLORS[item.genre]||'#6B7280';
  const myReview = item.reviews?.find(r=>r.user===currentUsername);

  const handleRateSubmit = async () => {
    if (!user) { alert("로그인 후 평가해 주세요."); return; }
    if (!user.emailVerified) { alert("이메일 인증 후 평가할 수 있습니다."); return; }
    if (myRating===0) return;
    setSubmitting(true);
    await onRate(item.id, myRating);
    setSubmitting(false);
  };

  const handleReviewSubmit = async (e) => {
    e.preventDefault();
    if (!user) { alert("로그인 후 리뷰를 남겨 주세요."); return; }
    if (!user.emailVerified) { alert("이메일 인증 후 리뷰를 작성할 수 있습니다."); return; }
    const text = reviewText.trim();
    if (!text) return;
    setSubmitting(true);
    await onReview(item.id, text);
    setReviewText('');
    setSubmitting(false);
  };

  const handleEditReviewSubmit = async (e) => {
    e.preventDefault();
    const text = editReviewText.trim();
    if (!text) return;
    setSubmitting(true);
    await onEditReview(item.id, text, editRating);
    setEditingReview(false);
    setSubmitting(false);
  };

  const handleDeleteMyReview = async () => {
    if (!window.confirm('내 리뷰와 평점을 삭제하겠습니까?')) return;
    setSubmitting(true);
    await onDeleteReview(item.id);
    setMyRating(0);
    setSubmitting(false);
  };

  return (
    <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[55] flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
      <div className="relative w-full max-w-[820px] bg-jazzCard rounded-2xl border border-zinc-800 flex flex-col md:flex-row shadow-2xl overflow-hidden max-h-[90vh] md:max-h-[80vh]">
        <button onClick={onClose} className="absolute top-3 right-3 z-40 w-8 h-8 flex items-center justify-center rounded-full bg-zinc-900/90 border border-zinc-700 text-zinc-300 hover:text-white transition">
          <i className="fa-times fa-solid text-xs"></i>
        </button>
        <div className="w-full md:w-[42%] flex-shrink-0 flex flex-col bg-black">
          <div className="aspect-square w-full bg-zinc-950 flex items-center justify-center overflow-hidden">
            {item.coverUrl
              ? <img src={item.coverUrl} className="w-full h-full object-cover" alt="cover" />
              : <div className="w-full h-full flex flex-col items-center justify-center gap-3 bg-gradient-to-b from-zinc-900 to-black">
                  <i className="fa-solid fa-music text-4xl text-zinc-700"></i>
                  <span className="text-[10px] text-zinc-600 uppercase tracking-widest">No Cover Art</span>
                </div>
            }
          </div>
          <div className="p-5 flex flex-col gap-3 border-t border-zinc-900/60">
            <div>
              <span className="genre-tag mb-2 inline-block" style={{background:genreColor+'22',color:genreColor,border:`1px solid ${genreColor}44`}}>{item.genre||'Other'}</span>
              <h2 className="text-lg font-light text-white mt-1">{item.title}</h2>
              <p className="text-xs text-zinc-500 font-light">{item.artist}</p>
            </div>
            <div className="flex items-center gap-3 py-2 border-t border-zinc-900/40">
              <div>
                <div className="text-2xl font-light text-jazzGold">{avg>0?avg.toFixed(1):'—'}</div>
                <div className="text-[9px] text-zinc-600 uppercase tracking-widest">{item.ratings?.length||0}명 평가</div>
              </div>
              <StarRating value={Math.round(avg)} readonly size="md" />
            </div>
            {item.youtubeId && (
              <a href={`https://youtube.com/watch?v=${item.youtubeId}`} target="_blank" rel="noopener noreferrer"
                className="flex items-center gap-2 text-[11px] text-zinc-400 hover:text-jazzRed transition border border-zinc-800 rounded px-3 py-2 bg-zinc-950/60">
                <i className="fa-brands fa-youtube text-jazzRed"></i>
                <span>YouTube에서 감상하기</span>
                <i className="fa-solid fa-arrow-up-right-from-square text-[9px] ml-auto"></i>
              </a>
            )}
            {item.desc && <p className="text-[11px] text-zinc-500 font-light leading-relaxed border-t border-zinc-900/40 pt-2">{item.desc}</p>}
            <p className="text-[9px] text-zinc-700 font-light">by {item.submittedBy} · {item.createdAt ? new Date(item.createdAt).toLocaleDateString('ko-KR') : ''}</p>
          </div>
        </div>
        <div className="flex flex-col w-full md:w-[58%] bg-jazzBlack overflow-hidden">
          <div className="p-4 border-b border-zinc-900/50 flex-shrink-0">
            <p className="text-[9px] tracking-widest text-zinc-500 uppercase mb-2.5">나의 평가</p>
            <div className="flex items-center gap-3">
              <StarRating value={editingReview ? editRating : myRating} onChange={editingReview ? setEditRating : setMyRating} size="lg" readonly={!user || !user.emailVerified} />
              {!editingReview && myRating>0 && (
                <button onClick={handleRateSubmit} disabled={submitting} className="text-[10px] bg-jazzGold/20 border border-jazzGold/40 text-jazzGold px-3 py-1 rounded hover:bg-jazzGold/30 transition disabled:opacity-50">
                  {submitting?'...':'평가 저장'}
                </button>
              )}
            </div>
            {!user && <p className="text-[9px] text-zinc-600 mt-1.5">로그인하면 별점을 남길 수 있어요.</p>}
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-2.5 feed-scroll-container min-h-0">
            <p className="text-[9px] tracking-widest text-zinc-500 uppercase mb-3">Reviews <span className="text-zinc-700">({(item.reviews||[]).length})</span></p>
            {(item.reviews||[]).length===0
              ? <div className="flex items-center justify-center h-24 text-[10px] text-zinc-700 uppercase tracking-widest">첫 번째 리뷰를 남겨보세요.</div>
              : [...(item.reviews||[])].reverse().map((rv,i) => {
                  const isMine = rv.user === currentUsername;
                  return (
                    <div key={i} className={`rounded-lg border p-3 ${isMine?'bg-zinc-900/60 border-jazzOrange/20':'bg-zinc-950/50 border-zinc-900/40'}`}>
                      <div className="flex items-start justify-between mb-1.5">
                        <div className="flex items-center gap-2">
                          <span className="text-[11px] font-medium text-jazzOrange">{rv.user}</span>
                          {rv.score>0 && <StarRating value={rv.score} readonly size="sm" />}
                          {isMine && <span className="text-[8px] bg-jazzOrange/15 text-jazzOrange px-1 py-0.5 rounded">나</span>}
                        </div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-[8px] text-zinc-700 font-light">{rv.createdAt?new Date(rv.createdAt).toLocaleDateString('ko-KR'):''}</span>
                          {isMine && (
                            <div className="flex gap-1">
                              <button onClick={()=>{setEditingReview(true);setEditReviewText(rv.text);setEditRating(rv.score||myRating);}} className="text-[9px] text-zinc-500 hover:text-jazzOrange transition px-1">수정</button>
                              <button onClick={handleDeleteMyReview} className="text-[9px] text-zinc-500 hover:text-jazzRed transition px-1">삭제</button>
                            </div>
                          )}
                        </div>
                      </div>
                      <p className="text-[11px] text-zinc-300 font-light leading-relaxed">{rv.text}</p>
                    </div>
                  );
              })
            }
          </div>
          <div className="p-3 border-t border-zinc-900/50 bg-zinc-950/30 flex-shrink-0">
            {editingReview ? (
              <form onSubmit={handleEditReviewSubmit} className="space-y-2">
                <div className="flex items-center justify-between mb-1">
                  <p className="text-[9px] text-jazzOrange uppercase tracking-widest">리뷰 수정</p>
                  <button type="button" onClick={()=>setEditingReview(false)} className="text-[9px] text-zinc-600 hover:text-zinc-400">취소</button>
                </div>
                <div className="mb-1"><StarRating value={editRating} onChange={setEditRating} size="md" /></div>
                <div className="flex gap-2">
                  <input type="text" value={editReviewText} onChange={e=>setEditReviewText(e.target.value)} className="flex-grow bg-zinc-950 border border-jazzOrange/40 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-jazzOrange font-light" placeholder="수정할 내용을 입력하세요..." />
                  <button type="submit" disabled={submitting} className="bg-jazzOrange text-black text-[11px] px-3 py-1.5 rounded font-medium hover:bg-amber-500 transition disabled:opacity-40">{submitting?'...':'저장'}</button>
                </div>
              </form>
            ) : myReview ? (
              <p className="text-[10px] text-zinc-600 text-center py-1.5">리뷰를 수정하려면 위 리뷰의 <span className="text-zinc-400">수정</span> 버튼을 눌러주세요.</p>
            ) : (
              <form onSubmit={handleReviewSubmit} className="flex gap-2">
                <input type="text" placeholder={user ? "이 음악에 대한 리뷰를 남겨주세요..." : "로그인 후 리뷰를 작성할 수 있습니다."} value={reviewText} onChange={e=>setReviewText(e.target.value)} disabled={!user||!user.emailVerified} className="flex-grow bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-jazzOrange disabled:opacity-40 font-light" />
                <button type="submit" disabled={!user||!user.emailVerified||submitting} className="bg-jazzOrange text-black text-[11px] px-3 py-1.5 rounded font-medium hover:bg-amber-500 transition disabled:opacity-40">게시</button>
              </form>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function GrooveBanner() {
  return (
    <div className="w-full flex justify-center px-3 md:px-4 z-10 mt-3 mb-20 md:mb-3">
      <div className="w-full max-w-[980px]">
        <div className="groove-banner-wrap relative overflow-hidden bg-jazzCard/65 backdrop-blur-xl rounded-2xl shadow-2xl p-4 md:p-5"
             style={{border:'1px solid rgba(63,63,70,0.3)', backgroundImage:'repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(255,161,0,0.012) 2px,rgba(255,161,0,0.012) 4px)'}}>

          {/* 헤더 라인 */}
          <div className="flex items-center gap-2 mb-4">
            <div className="w-1 h-4 bg-jazzOrange rounded-full"></div>
            <span className="text-zinc-400 font-light" style={{fontSize:'9px',letterSpacing:'0.22em',textTransform:'uppercase'}}>Community Space</span>
            <div className="flex-1" style={{height:'1px',background:'rgba(63,63,70,0.6)'}}></div>
            <span className="text-zinc-600" style={{fontSize:'8px',letterSpacing:'0.12em',textTransform:'uppercase'}}>New</span>
            <div className="w-1.5 h-1.5 rounded-full bg-jazzRed animate-pulse ml-1"></div>
          </div>

          {/* 메인 */}
          <div className="flex flex-col md:flex-row gap-4 md:gap-6 items-start md:items-center">

            {/* 왼쪽 */}
            <div className="flex items-center gap-4 flex-1 min-w-0">
              {/* 바이닐 */}
              <div className="relative flex-shrink-0" style={{width:'60px',height:'60px'}}>
                <div className="groove-vinyl w-full h-full rounded-full flex items-center justify-center"
                     style={{border:'2px solid rgba(63,63,70,0.6)',background:'radial-gradient(circle at 30% 30%, #2a2a2a, #0a0a0a)',boxShadow:'inset 0 0 12px rgba(0,0,0,0.8), 0 0 20px rgba(212,168,67,0.08)'}}>
                  <div className="w-5 h-5 rounded-full flex items-center justify-center"
                       style={{background:'radial-gradient(circle, #3d2a10, #1a0f05)',border:'1px solid rgba(212,168,67,0.3)'}}>
                    <div className="w-1.5 h-1.5 rounded-full" style={{background:'#0a0a0a',border:'1px solid #3f3f46'}}></div>
                  </div>
                </div>
                <div className="absolute top-1 right-2 w-1 h-1 rounded-full" style={{background:'rgba(212,168,67,0.4)'}}></div>
              </div>

              {/* 텍스트 */}
              <div className="min-w-0">
                <div className="mb-1.5">
                  <span style={{fontSize:'8px',letterSpacing:'0.18em',textTransform:'uppercase',padding:'2px 8px',borderRadius:'3px',background:'rgba(255,161,0,0.12)',color:'#FFA100',border:'1px solid rgba(255,161,0,0.25)'}}>
                    Phill the Groove
                  </span>
                </div>
                <h3 className="font-light text-white tracking-wide leading-snug" style={{fontSize:'15px'}}>
                  음악을 추천하고, 반응을 받고,{' '}
                  <span className="text-jazzOrange">랭크</span>를 쌓아보세요.
                </h3>
                <p className="text-zinc-500 font-light mt-1 leading-relaxed" style={{fontSize:'10px'}}>
                  커뮤니티 음악 추천 공간 — Drop a pick, earn your rank.
                </p>
              </div>
            </div>

            {/* 오른쪽 */}
            <div className="flex flex-col gap-3 flex-shrink-0 w-full md:w-auto">
              <div className="flex items-center gap-2">
                <span className="text-zinc-600 font-light" style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase'}}>Reactions</span>
                <div className="flex gap-1.5" style={{fontSize:'16px'}}>
                  {['🔴','🟠','🟡','🔵','⚫'].map((e,i) => (
                    <span key={i} className="groove-reaction" style={{cursor:'default'}}>{e}</span>
                  ))}
                </div>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-zinc-600 font-light" style={{fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase'}}>Ranks</span>
                <div className="flex gap-1.5" style={{fontSize:'13px'}}>
                  {['🌱','🎧','🔥','💎','👑'].map((e,i) => <span key={i}>{e}</span>)}
                </div>
              </div>
              <a href="https://phill-groove.phillie.site"
                 target="_blank"
                 rel="noopener noreferrer"
                 className="group flex items-center justify-center gap-2 rounded-lg transition-all duration-200 font-medium"
                 style={{padding:'10px 20px',border:'1px solid rgba(255,161,0,0.4)',background:'rgba(255,161,0,0.08)',color:'#FFA100',fontSize:'11px',letterSpacing:'0.15em',textTransform:'uppercase',textDecoration:'none'}}
                 onMouseOver={e=>e.currentTarget.style.background='rgba(255,161,0,0.18)'}
                 onMouseOut={e=>e.currentTarget.style.background='rgba(255,161,0,0.08)'}>
                <i className="fa-solid fa-record-vinyl text-xs"></i>
                <span>Enter the Groove</span>
                <i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:'9px',opacity:'0.6'}}></i>
              </a>
            </div>
          </div>

          {/* 하단 */}
          <div className="mt-4 pt-3 flex items-center justify-between" style={{borderTop:'1px solid rgba(24,24,27,0.5)'}}>
            <p className="text-zinc-700 font-light tracking-wider" style={{fontSize:'9px'}}>
              🎵 음악으로 연결되는 또 다른 Phill 공간
            </p>
            <div className="flex items-center gap-1.5">
              <div className="w-1 h-1 rounded-full" style={{background:'rgba(255,161,0,0.4)'}}></div>
              <div className="w-3" style={{height:'1px',background:'#27272a'}}></div>
              <div className="w-1 h-1 rounded-full" style={{background:'rgba(255,42,26,0.4)'}}></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [feeds, setFeeds] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedFeed, setSelectedFeed] = useState(null);
  const [currentImgIdx, setCurrentImgIdx] = useState(0);
  const [commentInputs, setCommentInputs] = useState({});
  const audioRef = useRef(null);
  const touchStartX = useRef(0);
  const touchEndX = useRef(0);
  const isDragging = useRef(false);
  const [user, setUser] = useState(null);
  const [showAuthModal, setShowAuthModal] = useState(false);
  const [authMode, setAuthMode] = useState('login');
  const [authEmail, setAuthEmail] = useState('');
  const [authPassword, setAuthPassword] = useState('');
  const [chatMessages, setChatMessages] = useState([]);
  const [chatInput, setChatInput] = useState('');
  const chatEndRef = useRef(null);
  const [activeTab, setActiveTab] = useState('archive');
  const [loungeItems, setLoungeItems] = useState([]);
  const [loungeLoading, setLoungeLoading] = useState(true);
  const [selectedMusic, setSelectedMusic] = useState(null);
  const [loungeFilter, setLoungeFilter] = useState('All');
  const [loungeSort, setLoungeSort] = useState('recent');
  const [loungeSearch, setLoungeSearch] = useState('');

  useEffect(() => {
    let unsubFeeds, unsubChats, unsubLounge, unsubAuth;
    const initFirestore = () => {
      const { db, collection, query, orderBy, onSnapshot } = window.__firestore;
      unsubFeeds = onSnapshot(query(collection(db,'feeds'), orderBy('createdAt','desc')), snap => {
        const data = snap.docs.map(d=>({id:d.id,...d.data()}));
        setFeeds(data); setLoading(false);
        setSelectedFeed(prev => prev ? (data.find(f=>f.id===prev.id)||null) : null);
      });
      unsubChats = onSnapshot(query(collection(db,'chats'), orderBy('createdAt','asc')), snap => {
        setChatMessages(snap.docs.map(d=>({id:d.id,...d.data()})));
      });
      unsubLounge = onSnapshot(query(collection(db,'music_lounge'), orderBy('createdAt','desc')), snap => {
        const data = snap.docs.map(d=>({id:d.id,...d.data()}));
        setLoungeItems(data); setLoungeLoading(false);
        setSelectedMusic(prev => prev ? (data.find(m=>m.id===prev.id)||null) : null);
      });
    };
    const initAuth = () => {
      const { auth, onAuthStateChanged } = window.__auth;
      return onAuthStateChanged(auth, u => setUser(u));
    };
    if (window.__firestore && window.__auth) { initFirestore(); unsubAuth = initAuth(); }
    else { window.addEventListener('firebase-ready', () => { initFirestore(); unsubAuth = initAuth(); }, { once: true }); }
    return () => { if(unsubFeeds)unsubFeeds(); if(unsubChats)unsubChats(); if(unsubLounge)unsubLounge(); if(unsubAuth)unsubAuth(); };
  }, []);

  useEffect(() => { if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior:'smooth' }); }, [chatMessages, activeTab]);

  const currentUsername = user ? user.email.split('@')[0] : '';

  const handleRate = async (musicId, score) => {
    const { db, doc, updateDoc } = window.__firestore;
    const item = loungeItems.find(m=>m.id===musicId);
    if (!item) return;
    const newRatings = [...(item.ratings||[]).filter(r=>r.user!==currentUsername), { user:currentUsername, score }];
    await updateDoc(doc(db,'music_lounge',musicId), { ratings:newRatings });
  };
  const handleReview = async (musicId, text) => {
    const { db, doc, updateDoc } = window.__firestore;
    const item = loungeItems.find(m=>m.id===musicId);
    if (!item) return;
    const myRating = (item.ratings||[]).find(r=>r.user===currentUsername);
    const newReview = { user:currentUsername, text, score:myRating?myRating.score:0, createdAt:Date.now() };
    await updateDoc(doc(db,'music_lounge',musicId), { reviews:[...(item.reviews||[]), newReview] });
  };
  const handleEditReview = async (musicId, text, score) => {
    const { db, doc, updateDoc } = window.__firestore;
    const item = loungeItems.find(m=>m.id===musicId);
    if (!item) return;
    const updatedReviews = (item.reviews||[]).map(r => r.user === currentUsername ? { ...r, text, score, editedAt: Date.now() } : r);
    const updatedRatings = score > 0 ? [...(item.ratings||[]).filter(r=>r.user!==currentUsername), { user:currentUsername, score }] : item.ratings;
    await updateDoc(doc(db,'music_lounge',musicId), { reviews:updatedReviews, ratings:updatedRatings });
  };
  const handleDeleteReview = async (musicId) => {
    const { db, doc, updateDoc } = window.__firestore;
    const item = loungeItems.find(m=>m.id===musicId);
    if (!item) return;
    await updateDoc(doc(db,'music_lounge',musicId), {
      reviews: (item.reviews||[]).filter(r=>r.user!==currentUsername),
      ratings: (item.ratings||[]).filter(r=>r.user!==currentUsername),
    });
  };

  const filteredLounge = loungeItems
    .filter(item => {
      if (loungeFilter !== 'All' && item.genre !== loungeFilter) return false;
      if (loungeSearch.trim()) { const q = loungeSearch.trim().toLowerCase(); return item.title.toLowerCase().includes(q) || item.artist.toLowerCase().includes(q); }
      return true;
    })
    .sort((a,b) => {
      if (loungeSort==='rating') { const avgA = a.ratings?.length?a.ratings.reduce((s,r)=>s+r.score,0)/a.ratings.length:0; const avgB = b.ratings?.length?b.ratings.reduce((s,r)=>s+r.score,0)/b.ratings.length:0; return avgB-avgA; }
      if (loungeSort==='reviews') return (b.reviews?.length||0)-(a.reviews?.length||0);
      return b.createdAt-a.createdAt;
    });

  const handleSendChatMessage = async (e) => {
    e.preventDefault();
    if (!user) { alert("채팅에 참여하려면 로그인해 주세요."); setAuthMode('login'); setShowAuthModal(true); return; }
    if (!user.emailVerified) { alert("이메일 인증 완료 후 참여 가능합니다."); return; }
    const text = chatInput.trim();
    if (!text) return;
    const { db, collection, addDoc } = window.__firestore;
    await addDoc(collection(db,'chats'), { user:currentUsername, text, createdAt:Date.now() }).catch(console.error);
    setChatInput('');
  };
  const handleAddComment = async (e, feedId) => {
    e.preventDefault();
    if (!user) { alert("방명록을 남기려면 로그인해 주세요."); setAuthMode('login'); setShowAuthModal(true); return; }
    if (!user.emailVerified) { alert("이메일 인증 후 참여 가능합니다."); return; }
    const text = (commentInputs[feedId]||"").trim();
    if (!text) return;
    const { db, doc, updateDoc, arrayUnion } = window.__firestore;
    await updateDoc(doc(db,'feeds',feedId), { comments:arrayUnion({user:currentUsername,text,createdAt:Date.now()}) }).catch(console.error);
    setCommentInputs({...commentInputs,[feedId]:""});
  };

  const nextImage = (n) => setCurrentImgIdx(p=>(p+1)%n);
  const prevImage = (n) => setCurrentImgIdx(p=>(p-1+n)%n);
  const handleTouchStart = (e) => { touchStartX.current=e.touches?.[0].clientX??e.clientX; touchEndX.current=touchStartX.current; isDragging.current=true; };
  const handleTouchMove = (e) => { if(isDragging.current) touchEndX.current=e.touches?.[0].clientX??e.clientX; };
  const handleTouchEnd = (n) => { if(!isDragging.current)return; isDragging.current=false; const d=touchStartX.current-touchEndX.current; if(Math.abs(d)>40) d>0?nextImage(n):prevImage(n); };

  const handleSignIn = (e) => { e.preventDefault(); const {auth,signInWithEmailAndPassword}=window.__auth; signInWithEmailAndPassword(auth,authEmail,authPassword).then(uc=>{if(!uc.user.emailVerified)alert("이메일 인증을 먼저 완료해 주세요.");else alert("재즈바에 입장하셨습니다.");closeAuthModal();}).catch(()=>alert("이메일 또는 비밀번호를 다시 확인하세요.")); };
  const handleSignUp = (e) => { e.preventDefault(); const {auth,createUserWithEmailAndPassword,sendEmailVerification}=window.__auth; createUserWithEmailAndPassword(auth,authEmail,authPassword).then(uc=>{sendEmailVerification(uc.user).then(()=>{alert("인증 메일을 발송했습니다. 인증 완료 후 로그인해 주세요.");window.__auth.signOut(auth);setAuthMode('login');});}).catch(err=>alert(`회원가입 실패: ${err.message}`)); };
  const handleFindPassword = (e) => { e.preventDefault(); const {auth,sendPasswordResetEmail}=window.__auth; sendPasswordResetEmail(auth,authEmail).then(()=>{alert("비밀번호 재설정 링크를 발송했습니다.");setAuthMode('login');}).catch(()=>alert("해당 이메일 계정을 찾을 수 없습니다.")); };
  const handleSignOut = () => { const {auth,signOut}=window.__auth; signOut(auth).then(()=>alert("로그아웃 되었습니다.")); };
  const closeAuthModal = () => { setShowAuthModal(false); setAuthEmail(''); setAuthPassword(''); };

  return (
    <div className="min-h-screen flex flex-col justify-between relative">
      <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] rounded-full bg-gradient-to-br from-jazzRed via-jazzOrange to-transparent opacity-10 blur-[160px] pointer-events-none z-0"></div>
      <audio ref={audioRef} src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" loop />

      <header className="w-full py-5 px-6 sticky top-0 bg-jazzBlack/80 backdrop-blur-md z-40 border-b border-zinc-900/40 flex items-center justify-between">
        <div className="w-16"></div>
        <div className="text-center">
          <h1 className="text-xl font-light tracking-[0.3em] text-white">PHILL</h1>
          <p className="text-[10px] tracking-widest text-zinc-500 mt-0.5 uppercase">Online bar & Quiet space</p>
        </div>
        <div className="w-16 text-right">
          {user ? (
            <div className="flex flex-col items-end gap-0.5">
              <span className="text-[9px] text-jazzGold truncate max-w-[60px]">{currentUsername}</span>
              <button onClick={handleSignOut} className="text-[10px] tracking-wider text-zinc-500 hover:text-white transition uppercase">Logout</button>
            </div>
          ) : (
            <button onClick={()=>{setAuthMode('login');setShowAuthModal(true);}} className="text-[10px] tracking-wider text-jazzOrange hover:text-white transition uppercase">Login</button>
          )}
        </div>
      </header>

      <main className="flex-1 w-full flex flex-col items-center p-3 md:p-4 z-10 pb-32 md:pb-4 gap-3">
        {/* 메인 카드 */}
        <div className="w-full max-w-[980px] bg-jazzCard/65 backdrop-blur-xl rounded-2xl border border-zinc-800/30 shadow-2xl flex flex-col md:flex-row md:h-[600px] overflow-hidden">
          <div className={`w-full md:w-[60%] p-4 flex flex-col h-full md:border-r border-zinc-900/60 ${activeTab==='archive'?'flex':'hidden md:flex'}`}>
            <div className="mb-3 px-1 flex items-center gap-2 flex-shrink-0">
              <span className="text-[10px] tracking-widest text-zinc-400 uppercase font-light">SOUND ARCHIVE</span>
            </div>
            <div className="flex-1 min-h-0">
              <div className="grid grid-cols-2 gap-3 md:max-h-full md:overflow-y-auto pr-1 pb-4 feed-scroll-container">
                {loading && (
                  <div className="col-span-2 h-full flex flex-col items-center justify-center text-zinc-600 text-xs font-light tracking-widest gap-2 py-32">
                    <i className="fa-solid fa-xs fa-circle-nodes animate-pulse"></i>
                    <span>LOADING SOUNDS...</span>
                  </div>
                )}
                {!loading && feeds.map(feed => {
                  const imgList = feed.coverImage ? feed.coverImage.split('\n').filter(Boolean) : [];
                  const hasImg = imgList.length>0;
                  const hasVideo = !!feed.youtubeId;
                  return (
                    <div key={feed.id} onClick={()=>{setSelectedFeed(feed);setCurrentImgIdx(0);}} className="group relative aspect-square w-full bg-zinc-950 rounded-xl overflow-hidden cursor-pointer border border-zinc-800/40 hover:border-jazzRed/50 active:scale-[0.98] transition-all duration-200">
                      {hasImg ? <img src={imgList[0]} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition" alt="cover" />
                        : hasVideo ? (
                          <div className="w-full h-full flex flex-col items-center justify-center bg-gradient-to-b from-zinc-900 to-black p-2 text-center">
                            <i className="fa-brands fa-youtube text-xl text-jazzRed mb-1"></i>
                            <span className="text-[8px] uppercase tracking-widest text-zinc-500 font-medium">YOUTUBE Loop</span>
                          </div>
                        ) : (
                          <div className="w-full h-full p-3 flex items-center justify-center text-center bg-zinc-900 text-[10px] font-light text-zinc-400 leading-relaxed overflow-hidden">
                            <p className="line-clamp-4">{feed.bio}</p>
                          </div>
                        )
                      }
                      {imgList.length>1 && <div className="absolute top-2 right-2 text-[9px] bg-black/60 px-1.5 py-0.5 rounded text-zinc-400"><i className="fa-solid fa-layer-group"></i></div>}
                      <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-3 opacity-95 md:opacity-0 md:group-hover:opacity-100 transition-opacity duration-300">
                        <h3 className="text-[11px] text-white truncate font-medium capitalize">{feed.title||'Untitled'}</h3>
                        <p className="text-[9px] text-jazzOrange truncate font-light mt-0.5">{feed.artistName||'Phill Session'}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          <div className={`w-full md:w-[40%] flex flex-col bg-black/15 overflow-hidden ${activeTab==='lounge'?'flex':activeTab==='archive'?'hidden md:flex':'hidden md:flex'}`}
               style={{ height: activeTab==='lounge' ? 'calc(100vh - 220px)' : undefined }}>
            <div className="p-3 border-b border-zinc-900/50 bg-black/20 flex-shrink-0">
              <div className="hidden md:flex gap-1">
                <button onClick={()=>setActiveTab('lounge')} className={`text-[9px] tracking-widest uppercase px-3 py-1 rounded transition ${activeTab==='lounge'||activeTab==='archive'?'bg-jazzOrange/20 text-jazzOrange border border-jazzOrange/30':'text-zinc-600'}`}>
                  <i className="fa-solid fa-headphones mr-1"></i>Music Lounge
                </button>
                <button onClick={()=>setActiveTab('chat')} className={`text-[9px] tracking-widest uppercase px-3 py-1 rounded transition ${activeTab==='chat'?'bg-jazzRed/20 text-jazzRed border border-jazzRed/30':'text-zinc-600'}`}>
                  <span className="w-1 h-1 rounded-full bg-jazzRed inline-block mr-1 animate-pulse"></span>Lounge Chat
                </button>
              </div>
              <div className="md:hidden flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <i className="fa-solid fa-headphones text-jazzOrange text-xs"></i>
                  <span className="text-[10px] tracking-widest text-zinc-300 uppercase font-light">Music Lounge</span>
                </div>
              </div>
            </div>
            <div className={`flex flex-col flex-1 min-h-0 overflow-hidden ${(activeTab==='lounge'||activeTab==='archive')?'flex':'hidden'}`}>
              <div className="px-3 py-2.5 border-b border-zinc-900/40 flex-shrink-0 space-y-2">
                <div className="flex gap-2">
                  <div className="relative flex-1">
                    <i className="fa-solid fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-zinc-600 text-[10px]"></i>
                    <input type="text" placeholder="곡명 또는 아티스트 검색..." value={loungeSearch} onChange={e=>setLoungeSearch(e.target.value)} className="w-full bg-zinc-950/70 border border-zinc-800 rounded pl-7 pr-3 py-1.5 text-[11px] text-white focus:outline-none focus:border-jazzOrange font-light" />
                  </div>
                </div>
                <div className="flex gap-1.5 overflow-x-auto pb-0.5" style={{scrollbarWidth:'none'}}>
                  {['All',...GENRES].map(g=>(
                    <button key={g} onClick={()=>setLoungeFilter(g)} className={`flex-shrink-0 text-[9px] uppercase tracking-wider px-2 py-0.5 rounded transition ${loungeFilter===g?'bg-jazzOrange text-black font-medium':'bg-zinc-900/60 text-zinc-500 hover:text-zinc-300'}`}>{g}</button>
                  ))}
                </div>
                <div className="flex gap-2">
                  {[['recent','최신순'],['rating','별점순'],['reviews','리뷰순']].map(([val,label])=>(
                    <button key={val} onClick={()=>setLoungeSort(val)} className={`text-[9px] uppercase tracking-wider px-2 py-0.5 rounded transition ${loungeSort===val?'text-white bg-zinc-700':'text-zinc-600 hover:text-zinc-400'}`}>{label}</button>
                  ))}
                </div>
              </div>
              <div className="flex-1 overflow-y-auto p-3 space-y-2 feed-scroll-container">
                {loungeLoading && <div className="flex flex-col items-center justify-center h-32 text-zinc-600 text-[10px] uppercase tracking-widest gap-2"><i className="fa-solid fa-compact-disc animate-spin"></i><span>Loading Lounge...</span></div>}
                {!loungeLoading && filteredLounge.length===0 && <div className="flex flex-col items-center justify-center h-32 text-zinc-700 text-[10px] uppercase tracking-widest gap-2 text-center"><i className="fa-solid fa-music text-zinc-800 text-2xl"></i><span>등록된 음악이 없습니다.</span></div>}
                {!loungeLoading && filteredLounge.map(item=><MusicCard key={item.id} item={item} onOpen={setSelectedMusic} />)}
              </div>
            </div>
            <div className={`flex flex-col flex-1 min-h-0 overflow-hidden ${activeTab==='chat'?'flex':'hidden'}`}>
              <div className="flex items-center gap-2 px-4 py-2.5 border-b border-zinc-900/30 flex-shrink-0">
                <span className="w-1.5 h-1.5 rounded-full bg-jazzRed animate-pulse"></span>
                <span className="text-[9px] tracking-widest text-zinc-400 uppercase">Live Chat</span>
              </div>
              <div className="flex-1 overflow-y-auto p-4 space-y-3 feed-scroll-container">
                {chatMessages.length===0
                  ? <div className="h-full flex items-center justify-center text-zinc-600 text-[10px] font-light tracking-widest text-center">BAR LOUNGE IS QUIET.<br/>LEAVE A NOTE FIRST.</div>
                  : chatMessages.map(msg=>(
                    <div key={msg.id} className="text-[11px] leading-relaxed bg-zinc-950/30 p-2 rounded border border-zinc-900/10">
                      <div className="flex items-center justify-between mb-0.5">
                        <span className={`font-medium ${msg.user===currentUsername?'text-jazzRed':'text-jazzOrange'}`}>{msg.user}</span>
                        <span className="text-[8px] text-zinc-600 font-light">{msg.createdAt?new Date(msg.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</span>
                      </div>
                      <span className="text-zinc-300 font-light break-all">{msg.text}</span>
                    </div>
                  ))
                }
                <div ref={chatEndRef} />
              </div>
              <form onSubmit={handleSendChatMessage} className="p-3 border-t border-zinc-900/50 flex gap-2 bg-jazzBlack/40">
                <input type="text" placeholder={user?"공간에 어울리는 이야기를...":"로그인 후 참여해보세요."} value={chatInput} onChange={e=>setChatInput(e.target.value)} disabled={!user} className="flex-grow bg-zinc-950/80 border border-zinc-800/80 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-jazzRed font-light disabled:opacity-40" />
                <button type="submit" disabled={!user} className="bg-jazzRed text-white text-xs px-3.5 py-2 rounded font-medium hover:bg-red-700 transition disabled:opacity-40"><i className="fa-solid fa-paper-plane text-[10px]"></i></button>
              </form>
            </div>
          </div>
        </div>

        {/* ★ Phill the Groove 배너 ★ */}
        <GrooveBanner />
      </main>

      {/* 모바일 하단 탭 */}
      <div className="md:hidden fixed bottom-0 left-0 right-0 h-[53px] bg-jazzCard/95 backdrop-blur-lg border-t border-zinc-900 flex z-30">
        <button onClick={()=>setActiveTab('archive')} className={`flex-1 flex flex-col items-center justify-center gap-0.5 text-[9px] tracking-widest uppercase transition ${activeTab==='archive'?'text-jazzRed font-medium':'text-zinc-600'}`}><i className="fa-solid fa-compact-disc text-xs"></i><span>Sounds</span></button>
        <div className="w-[1px] h-6 bg-zinc-900 my-auto"></div>
        <button onClick={()=>setActiveTab('lounge')} className={`flex-1 flex flex-col items-center justify-center gap-0.5 text-[9px] tracking-widest uppercase transition ${activeTab==='lounge'?'text-jazzOrange font-medium':'text-zinc-600'}`}><i className="fa-solid fa-headphones text-xs"></i><span>Lounge</span></button>
        <div className="w-[1px] h-6 bg-zinc-900 my-auto"></div>

      {activeTab==='chat' && (
        <div className="md:hidden fixed inset-0 top-[60px] bottom-[53px] bg-jazzBlack z-20 flex flex-col">
          <div className="flex items-center gap-2 px-4 py-3 border-b border-zinc-900/50 bg-black/20"><span className="w-1.5 h-1.5 rounded-full bg-jazzRed animate-pulse"></span><span className="text-[10px] tracking-widest text-zinc-300 uppercase font-light">Lounge Live Chat</span></div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3 feed-scroll-container">
            {chatMessages.length===0
              ? <div className="h-full flex items-center justify-center text-zinc-600 text-[10px] font-light tracking-widest text-center">BAR LOUNGE IS QUIET.<br/>LEAVE A NOTE FIRST.</div>
              : chatMessages.map(msg=>(
                <div key={msg.id} className="text-[11px] leading-relaxed bg-zinc-950/30 p-2 rounded border border-zinc-900/10">
                  <div className="flex items-center justify-between mb-0.5">
                    <span className={`font-medium ${msg.user===currentUsername?'text-jazzRed':'text-jazzOrange'}`}>{msg.user}</span>
                    <span className="text-[8px] text-zinc-600 font-light">{msg.createdAt?new Date(msg.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</span>
                  </div>
                  <span className="text-zinc-300 font-light break-all">{msg.text}</span>
                </div>
              ))}
            <div ref={chatEndRef} />
          </div>
          <form onSubmit={handleSendChatMessage} className="p-3 border-t border-zinc-900/50 flex gap-2 bg-jazzBlack/80">
            <input type="text" placeholder={user?"공간에 어울리는 이야기를...":"로그인 후 참여해보세요."} value={chatInput} onChange={e=>setChatInput(e.target.value)} disabled={!user} className="flex-grow bg-zinc-950/80 border border-zinc-800/80 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-jazzRed font-light disabled:opacity-40" />
            <button type="submit" disabled={!user} className="bg-jazzRed text-white text-xs px-3.5 py-2 rounded font-medium hover:bg-red-700 transition disabled:opacity-40"><i className="fa-solid fa-paper-plane text-[10px]"></i></button>
          </form>
        </div>
      )}

      {/* 인증 모달 */}
      {showAuthModal && (
        <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="relative w-full max-w-sm bg-jazzCard rounded-2xl border border-zinc-800 p-8 shadow-2xl text-center space-y-5">
            <button onClick={closeAuthModal} className="absolute top-4 right-4 text-zinc-500 hover:text-white text-sm"><i className="fa-times fa-solid"></i></button>
            {authMode==='login' && (<>
              <h2 className="text-xs tracking-[0.25em] text-white uppercase font-light">Jazzbar Access Space</h2>
              <form onSubmit={handleSignIn} className="space-y-3 pt-2">
                <input type="email" placeholder="이메일 계정" value={authEmail} onChange={e=>setAuthEmail(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs text-white focus:outline-none focus:border-jazzRed font-light" required />
                <input type="password" placeholder="비밀번호" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs text-white focus:outline-none focus:border-jazzRed font-light" required />
                <button type="submit" className="w-full bg-jazzRed text-white text-xs py-2.5 rounded font-medium hover:bg-red-700 transition">SIGN IN</button>
              </form>
              <div className="flex justify-center gap-4 text-[10px] text-zinc-500 pt-2">
                <button onClick={()=>{setAuthMode('signup');setAuthEmail('');setAuthPassword('');}} className="hover:text-zinc-300 transition">회원가입</button>
                <span className="text-zinc-800">|</span>
                <button onClick={()=>setAuthMode('findId')} className="hover:text-zinc-300 transition">아이디 찾기</button>
                <span className="text-zinc-800">|</span>
                <button onClick={()=>{setAuthMode('findPw');setAuthEmail('');}} className="hover:text-zinc-300 transition">비밀번호 찾기</button>
              </div>
            </>)}
            {authMode==='signup' && (<>
              <h2 className="text-xs tracking-[0.25em] text-white uppercase font-light">Create Account</h2>
              <form onSubmit={handleSignUp} className="space-y-3 pt-2">
                <input type="email" placeholder="사용할 이메일 계정" value={authEmail} onChange={e=>setAuthEmail(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs text-white focus:outline-none focus:border-jazzRed font-light" required />
                <input type="password" placeholder="비밀번호 (6자리 이상)" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs text-white focus:outline-none focus:border-jazzRed font-light" required />
                <button type="submit" className="w-full bg-jazzOrange text-black text-xs py-2.5 rounded font-medium hover:bg-amber-600 transition">REGISTER</button>
              </form>
              <div className="pt-2"><button onClick={()=>{setAuthMode('login');setAuthEmail('');setAuthPassword('');}} className="text-[10px] text-zinc-500 hover:text-zinc-300 transition">이미 계정이 있으신가요? 로그인</button></div>
            </>)}
            {authMode==='findId' && (<>
              <h2 className="text-xs tracking-[0.25em] text-white uppercase font-light">Find Email Account</h2>
              <div className="text-left text-xs text-zinc-400 font-light leading-relaxed p-4 bg-zinc-950/50 rounded border border-zinc-900 space-y-2">
                <p>본 플랫폼은 별도의 개인정보를 수집하지 않으며, <strong className="text-jazzOrange">이메일 주소 자체를 고유 ID</strong>로 사용합니다.</p>
                <p>사용하셨던 메일함에서 <span className="text-zinc-200">"phill-bar"</span> 발신 인증 메일을 확인해 주세요.</p>
              </div>
              <button onClick={()=>setAuthMode('login')} className="w-full bg-zinc-800 text-zinc-300 text-xs py-2 rounded hover:bg-zinc-700 transition">로그인 화면으로 돌아가기</button>
            </>)}
            {authMode==='findPw' && (<>
              <h2 className="text-xs tracking-[0.25em] text-white uppercase font-light">Reset Password</h2>
              <p className="text-[11px] text-zinc-500 font-light">가입하셨던 이메일 주소를 입력하시면<br/>비밀번호 재설정 링크를 보내드립니다.</p>
              <form onSubmit={handleFindPassword} className="space-y-3 pt-2">
                <input type="email" placeholder="가입한 이메일 계정" value={authEmail} onChange={e=>setAuthEmail(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs text-white focus:outline-none focus:border-jazzRed font-light" required />
                <button type="submit" className="w-full bg-jazzRed text-white text-xs py-2.5 rounded font-medium hover:bg-red-700 transition">SEND RESET LINK</button>
              </form>
              <button onClick={()=>setAuthMode('login')} className="text-[10px] text-zinc-500 hover:text-zinc-300 transition">로그인 화면으로 돌아가기</button>
            </>)}
          </div>
        </div>
      )}

      {/* Archive 피드 모달 */}
      {selectedFeed && (() => {
        const images = selectedFeed.coverImage ? selectedFeed.coverImage.split('\n').filter(Boolean) : [];
        const hasImg = images.length>0;
        const hasVideo = !!selectedFeed.youtubeId;
        return (
          <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
            <div className="relative w-full max-w-[850px] h-full max-h-[85vh] bg-jazzCard rounded-2xl border border-zinc-800 flex flex-col md:flex-row shadow-2xl overflow-y-auto md:overflow-hidden">
              <button onClick={()=>setSelectedFeed(null)} className="absolute top-3 right-3 z-40 w-8 h-8 flex items-center justify-center rounded-full bg-zinc-900/90 border border-zinc-700 text-zinc-300 hover:text-white transition"><i className="fa-times fa-solid text-xs"></i></button>
              <div className="w-full md:w-1/2 aspect-square flex-shrink-0 bg-black relative overflow-hidden select-none" onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={()=>handleTouchEnd(images.length)}>
                {hasVideo && <div className="yt-hidden-player"><iframe src={`https://www.youtube.com/embed/${selectedFeed.youtubeId}?autoplay=1&mute=0&loop=1&playlist=${selectedFeed.youtubeId}&start=${selectedFeed.startTime||0}&end=${selectedFeed.endTime||0}&controls=0`} title="YT" frameBorder="0" width="1" height="1"></iframe></div>}
                {hasImg ? <img src={images[currentImgIdx]} className="w-full h-full object-cover pointer-events-none" alt="modal-cover" /> : <div className="w-full h-full flex items-center justify-center text-xs text-zinc-600 font-mono">AUDIO SESSION</div>}
                {hasImg && images.length>1 && (<>
                  <button onClick={e=>{e.stopPropagation();prevImage(images.length);}} className="absolute left-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/60 text-white flex items-center justify-center hover:bg-jazzRed z-20"><i className="fa-solid fa-chevron-left text-xs"></i></button>
                  <button onClick={e=>{e.stopPropagation();nextImage(images.length);}} className="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/60 text-white flex items-center justify-center hover:bg-jazzRed z-20"><i className="fa-solid fa-chevron-right text-xs"></i></button>
                  <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 z-20 bg-black/40 px-2.5 py-1 rounded-full">
                    {images.map((_,idx)=><span key={idx} onClick={e=>{e.stopPropagation();setCurrentImgIdx(idx);}} className={`w-1.5 h-1.5 rounded-full cursor-pointer transition-all duration-300 ${idx===currentImgIdx?'bg-jazzRed scale-110':'bg-zinc-500/60'}`} />)}
                  </div>
                </>)}
              </div>
              <div className="flex flex-col justify-between bg-jazzBlack p-4 md:p-6 w-full md:w-1/2 flex-1 min-h-0">
                <div className="flex flex-col gap-3 flex-1 overflow-y-auto min-h-0">
                  <div>
                    <h2 className="text-base md:text-xl font-light text-white truncate capitalize">{selectedFeed.title||'Untitled'}</h2>
                    <p className="text-[11px] md:text-xs text-zinc-500 font-light mt-0.5">{selectedFeed.artistName||'Phill Session'}</p>
                  </div>
                  <div className="w-full text-xs text-zinc-400 font-light leading-relaxed whitespace-pre-wrap py-2.5 border-t border-b border-zinc-900/60">{selectedFeed.bio||<span className="text-zinc-700 italic">소개가 없습니다.</span>}</div>
                  <div className="flex-1 min-h-[80px] overflow-y-auto feed-scroll-container space-y-2 text-[11px]">
                    {(selectedFeed.comments||[]).map((c,i)=>(
                      <div key={i} className="bg-zinc-950/40 p-2 rounded border border-zinc-900/30">
                        <span className="font-medium text-jazzOrange mr-1.5">{c.user}</span>
                        <span className="text-zinc-400 font-light">{c.text}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <form onSubmit={e=>handleAddComment(e,selectedFeed.id)} className="flex gap-2 pt-3 border-t border-zinc-900/60 mt-2">
                  <input type="text" placeholder="방명록을 남겨주세요..." value={commentInputs[selectedFeed.id]||""} onChange={e=>setCommentInputs({...commentInputs,[selectedFeed.id]:e.target.value})} className="flex-grow bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-jazzRed" />
                  <button type="submit" className="bg-jazzRed text-white text-[11px] px-3 py-1.5 rounded font-medium hover:bg-red-700 transition">게시</button>
                </form>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Music Lounge 상세 모달 */}
      {selectedMusic && (
        <MusicDetailModal item={selectedMusic} user={user} onClose={()=>setSelectedMusic(null)}
          onRate={handleRate} onReview={handleReview} onEditReview={handleEditReview}
          onDeleteReview={handleDeleteReview} currentUsername={currentUsername} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
