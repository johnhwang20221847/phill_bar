<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phill | Online Jazzbar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, onSnapshot, query, orderBy, arrayUnion, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADaeEPaUvLyU6J8eIPIy9luNeDhizxg-Q",
    authDomain: "phill-bar.firebaseapp.com",
    projectId: "phill-bar",
    storageBucket: "phill-bar.firebasestorage.app",
    messagingSenderId: "298800907820",
    appId: "1:298800907820:web:98b360862cf2b0c6deb389",
    measurementId: "G-BHQEZYV429"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.__firestore = { db, collection, getDocs, doc, updateDoc, onSnapshot, query, orderBy, arrayUnion, addDoc };
  window.__auth = { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail };
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<style>
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #FF2A1A; border-radius: 4px; }
  .feed-scroll-container { scrollbar-width: thin; scrollbar-color: #FF2A1A transparent; }
</style>
</head>
<body class="bg-[#060202] text-zinc-300 font-sans min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [activeTab, setActiveTab] = useState('archive');
  const [feeds, setFeeds] = useState([]);
  const [picks, setPicks] = useState([]);
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const { db, collection, query, orderBy, onSnapshot } = window.__firestore;
    
    // Feeds 로드
    const qFeeds = query(collection(db, 'feeds'), orderBy('createdAt', 'desc'));
    const unsubFeeds = onSnapshot(qFeeds, (snapshot) => {
      setFeeds(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });

    // Picks 로드
    const qPicks = query(collection(db, 'music_picks'), orderBy('createdAt', 'desc'));
    const unsubPicks = onSnapshot(qPicks, (snapshot) => {
      setPicks(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
    });

    const { auth, onAuthStateChanged } = window.__auth;
    const unsubAuth = onAuthStateChanged(auth, (u) => setUser(u));

    return () => { unsubFeeds(); unsubPicks(); unsubAuth(); };
  }, []);

  return (
    <div className="flex flex-col h-screen">
      <header className="p-6 text-center border-b border-zinc-900">
        <h1 className="text-xl tracking-[0.3em] text-white">PHILL</h1>
      </header>

      <main className="flex-1 overflow-hidden flex justify-center p-4">
        <div className="w-full max-w-[980px] bg-[#120A0A]/60 rounded-2xl border border-zinc-800 flex overflow-hidden">
          
          {/* Archive 탭 */}
          <div className={`flex-1 p-4 ${activeTab === 'archive' ? 'block' : 'hidden md:block'}`}>
            <h2 className="text-[10px] text-zinc-400 mb-4">ARCHIVE</h2>
            <div className="grid grid-cols-2 gap-2 overflow-y-auto h-full pb-20">
              {feeds.map(f => <div key={f.id} className="aspect-square bg-zinc-900 rounded-lg flex items-center justify-center text-[10px]">{f.title}</div>)}
            </div>
          </div>

          {/* Lounge 탭 */}
          <div className={`flex-1 p-4 border-l border-zinc-900 ${activeTab === 'lounge' ? 'block' : 'hidden md:block'}`}>
            <h2 className="text-[10px] text-zinc-400 mb-4">LOUNGE</h2>
            <div className="h-full bg-black/20 rounded p-2 text-[10px]">채팅 영역...</div>
          </div>

          {/* Picks 탭 */}
          <div className={`flex-1 p-4 border-l border-zinc-900 ${activeTab === 'picks' ? 'block' : 'hidden md:block'}`}>
            <h2 className="text-[10px] text-zinc-400 mb-4">MUSIC PICKS</h2>
            <div className="space-y-4 overflow-y-auto h-full pb-20">
              {picks.map(p => (
                <div key={p.id} className="bg-zinc-950 p-3 rounded border border-zinc-800">
                  <p className="text-xs text-white">{p.title}</p>
                  <p className="text-[9px] text-zinc-500 mb-2">{p.artist}</p>
                  <div className="text-jazzOrange">
                    {[1,2,3,4,5].map(s => <i key={s} className="fa-star fa-solid text-[10px] mr-1"></i>)}
                    <span className="text-[10px] ml-2 text-zinc-400">({p.rating}/5)</span>
                  </div>
                </div>
              ))}
            </div>
          </div>

        </div>
      </main>

      {/* 모바일 하단 탭 */}
      <div className="md:hidden flex border-t border-zinc-900 bg-[#120A0A] p-2">
        {['archive', 'lounge', 'picks'].map(tab => (
          <button key={tab} onClick={() => setActiveTab(tab)} className="flex-1 text-[10px] uppercase text-zinc-500">
            {tab}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
