<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phill | Online Jazzbar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght=200;300;400;500&family=Noto+Sans+KR:wght=300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, onSnapshot, query, orderBy, arrayUnion, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADaeEPaUvLyU6J8eIPIy9luNeDhizxg-Q",
    authDomain: "phill-bar.firebaseapp.com",
    projectId: "phill-bar",
    storageBucket: "phill-bar.firebasestorage.app",
    messagingSenderId: "298800907820",
    appId: "1:298800907820:web:98b360862cf2b0c6deb389",
    measurementId: "G-BHQEZYV429"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.__firestore = { db, collection, getDocs, doc, updateDoc, onSnapshot, query, orderBy, arrayUnion, addDoc };
  window.__auth = { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail };
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<script>
tailwind.config = {
  theme: { extend: { colors: { jazzBlack: '#060202', jazzCard: '#120A0A', jazzRed: '#FF2A1A', jazzOrange: '#FFA100' }, fontFamily: { sans: ['Outfit', 'Noto Sans KR', 'sans-serif'] } } }
}
</script>
<style>
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #FF2A1A; border-radius: 4px; }
.feed-scroll-container { scrollbar-width: thin; scrollbar-color: #FF2A1A transparent; }
</style>
</head>
<body class="bg-jazzBlack text-zinc-300">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// [새로 추가된 컴포넌트]
function MusicPick() {
  return (
    <div className="h-full flex flex-col items-center justify-center text-zinc-600 p-8 text-center">
      <i className="fa-solid fa-record-vinyl text-4xl mb-4 text-jazzOrange/30"></i>
      <h3 className="text-xs tracking-widest uppercase text-zinc-400">Music Pick</h3>
      <p className="text-[10px] mt-2 font-light">준비 중인 큐레이션 공간입니다.</p>
    </div>
  );
}

function App() {
  // 기존 상태들 유지
  const [activeTab, setActiveTab] = useState('archive');
  const [feeds, setFeeds] = useState([]);
  const [loading, setLoading] = useState(true);
  const [chatMessages, setChatMessages] = useState([]);
  const [user, setUser] = useState(null);

  // Firebase 초기화 후 데이터 가져오기 로직 (기존과 동일)
  useEffect(() => {
    if(window.__firestore) {
      const { db, collection, query, orderBy, onSnapshot } = window.__firestore;
      const qFeeds = query(collection(db, 'feeds'), orderBy('createdAt', 'desc'));
      onSnapshot(qFeeds, (s) => { setFeeds(s.docs.map(d=>({id:d.id, ...d.data()}))); setLoading(false); });
      
      const qChats = query(collection(db, 'chats'), orderBy('createdAt', 'asc'));
      onSnapshot(qChats, (s) => setChatMessages(s.docs.map(d=>({id:d.id, ...d.data()}))));
    }
  }, []);

  return (
    <div className="flex flex-col h-screen">
      <header className="py-5 border-b border-zinc-900 text-center">
        <h1 className="text-lg tracking-[0.3em] text-white">PHILL</h1>
      </header>

      {/* 탭 네비게이션 */}
      <nav className="flex justify-center gap-6 py-4 border-b border-zinc-900/50">
        {['archive', 'lounge', 'picks'].map((tab) => (
          <button 
            key={tab}
            onClick={() => setActiveTab(tab)}
            className={`text-[10px] uppercase tracking-widest transition ${activeTab === tab ? 'text-jazzRed' : 'text-zinc-600'}`}
          >
            {tab}
          </button>
        ))}
      </nav>

      {/* 메인 콘텐츠 영역 */}
      <main className="flex-1 overflow-hidden p-4">
        <div className="w-full max-w-[980px] mx-auto h-full bg-jazzCard/65 rounded-2xl overflow-hidden border border-zinc-900">
          
          {activeTab === 'archive' && (
             <div className="p-4 h-full overflow-y-auto">
               <p className="text-center text-zinc-500 py-10">기존 게시판 로직이 이곳에 위치합니다.</p>
             </div>
          )}

          {activeTab === 'lounge' && (
             <div className="p-4 h-full overflow-y-auto">
               <p className="text-center text-zinc-500 py-10">기존 채팅 로직이 이곳에 위치합니다.</p>
             </div>
          )}

          {activeTab === 'picks' && <MusicPick />}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
