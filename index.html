<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phill | Online Jazzbar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#060202] text-zinc-300 font-sans">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [activeTab, setActiveTab] = useState('archive');
  const [feeds, setFeeds] = useState([]);
  const [selectedFeed, setSelectedFeed] = useState(null);
  const [imgIndex, setImgIndex] = useState(0);

  useEffect(() => {
    // Firebase 데이터 로드 로직 (이전과 동일)
    const { db, collection, query, orderBy, onSnapshot } = window.__firestore;
    return onSnapshot(query(collection(db, 'feeds'), orderBy('createdAt', 'desc')), (snapshot) => {
      setFeeds(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
    });
  }, []);

  // 모달 열릴 때 인덱스 초기화
  const openModal = (feed) => {
    setSelectedFeed(feed);
    setImgIndex(0);
  };

  const images = selectedFeed?.coverImage ? selectedFeed.coverImage.split('\n') : [];

  return (
    <div className="flex flex-col h-screen">
      <header className="p-6 text-center border-b border-zinc-900">
        <h1 className="text-xl tracking-[0.3em] text-white">PHILL</h1>
        <nav className="flex justify-center gap-6 mt-4">
          {['archive', 'lounge', 'picks'].map(tab => (
            <button key={tab} onClick={() => setActiveTab(tab)} className={`text-[10px] uppercase tracking-widest ${activeTab === tab ? 'text-jazzRed' : 'text-zinc-600'}`}>
              {tab}
            </button>
          ))}
        </nav>
      </header>

      <main className="flex-1 overflow-y-auto p-4 flex justify-center">
        <div className="w-full max-w-[980px] grid grid-cols-2 md:grid-cols-4 gap-4">
          {feeds.map(f => (
            <div key={f.id} onClick={() => openModal(f)} className="aspect-square bg-zinc-900 rounded-lg overflow-hidden cursor-pointer hover:opacity-80">
              <img src={f.coverImage?.split('\n')[0]} className="w-full h-full object-cover" />
            </div>
          ))}
        </div>
      </main>

      {/* 상세 모달 */}
      {selectedFeed && (
        <div className="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4" onClick={() => setSelectedFeed(null)}>
          <div className="bg-[#120A0A] w-full max-w-lg rounded-2xl border border-zinc-800 overflow-hidden" onClick={e => e.stopPropagation()}>
            
            {/* 이미지 슬라이더 영역 */}
            <div className="relative aspect-square w-full">
              <img src={images[imgIndex]} className="w-full h-full object-cover" />
              
              {/* 좌우 네비게이션 */}
              {images.length > 1 && (
                <>
                  <button className="absolute left-2 top-1/2 bg-black/50 p-2 rounded-full text-white" onClick={() => setImgIndex(i => (i === 0 ? images.length - 1 : i - 1))}>
                    <i className="fa-solid fa-chevron-left"></i>
                  </button>
                  <button className="absolute right-2 top-1/2 bg-black/50 p-2 rounded-full text-white" onClick={() => setImgIndex(i => (i === images.length - 1 ? 0 : i + 1))}>
                    <i className="fa-solid fa-chevron-right"></i>
                  </button>
                  {/* 이미지 하단 슬라이더 바/인디케이터 */}
                  <div className="absolute bottom-4 left-0 w-full flex justify-center gap-1">
                    {images.map((_, idx) => (
                      <div key={idx} className={`h-1 w-6 rounded-full ${imgIndex === idx ? 'bg-white' : 'bg-white/30'}`}></div>
                    ))}
                  </div>
                </>
              )}
            </div>

            <div className="p-6">
              <h2 className="text-white text-lg mb-2">{selectedFeed.title}</h2>
              <p className="text-zinc-400 text-xs">{selectedFeed.bio}</p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
