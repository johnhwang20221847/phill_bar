<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phill | Online Jazzbar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght=200;300;400;500&family=Noto+Sans+KR:wght=300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, onSnapshot, query, orderBy, arrayUnion, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADaeEPaUvLyU6J8eIPIy9luNeDhizxg-Q",
    authDomain: "phill-bar.firebaseapp.com",
    projectId: "phill-bar",
    storageBucket: "phill-bar.firebasestorage.app",
    messagingSenderId: "298800907820",
    appId: "1:298800907820:web:98b360862cf2b0c6deb389",
    measurementId: "G-BHQEZYV429"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.__firestore = { db, collection, getDocs, doc, updateDoc, onSnapshot, query, orderBy, arrayUnion, addDoc };
  window.__auth = { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail };
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { jazzBlack: '#060202', jazzCard: '#120A0A', jazzRed: '#FF2A1A', jazzOrange: '#FFA100' },
      fontFamily: { sans: ['Outfit', 'Noto Sans KR', 'sans-serif'] }
    }
  }
}
</script>
<style>
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #FF2A1A; border-radius: 4px; }
.feed-scroll-container { scrollbar-width: thin; scrollbar-color: #FF2A1A transparent; }

.yt-hidden-player {
  position: absolute;
  width: 1px;
  height: 1px;
  top: 0;
  left: 0;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}
</style>
</head>
<body class="bg-jazzBlack text-zinc-300 font-sans min-h-screen overflow-hidden relative flex flex-col justify-between">
<div id="root" class="w-full h-screen flex flex-col justify-between z-10"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [feeds, setFeeds] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedFeed, setSelectedFeed] = useState(null);
  const [currentImgIdx, setCurrentImgIdx] = useState(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const [commentInputs, setCommentInputs] = useState({});
  const audioRef = useRef(null);

  const [user, setUser] = useState(null);
  const [showAuthModal, setShowAuthModal] = useState(false);
  const [authMode, setAuthMode] = useState('login'); 
  const [authEmail, setAuthEmail] = useState('');
  const [authPassword, setAuthPassword] = useState('');
  const [idFindGuide, setIdFindGuide] = useState('');

  const [editingCommentIdx, setEditingCommentIdx] = useState(null);
  const [editingCommentText, setEditingCommentText] = useState('');

  // 💬 라운지 대화방 상태 및 레퍼런스
  const [chatMessages, setChatMessages] = useState([]);
  const [chatInput, setChatInput] = useState('');
  const chatEndRef = useRef(null);

  // 📱 모바일 전용 탭 상태 ('archive' = 게시판, 'lounge' = 채팅)
  const [activeTab, setActiveTab] = useState('archive');

  useEffect(() => {
    let unsubFeeds;
    let unsubChats;

    const initFirestore = () => {
      const { db, collection, query, orderBy, onSnapshot } = window.__firestore;
      
      const qFeeds = query(collection(db, 'feeds'), orderBy('createdAt', 'desc'));
      unsubFeeds = onSnapshot(qFeeds, (snapshot) => {
        const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        setFeeds(data);
        setLoading(false);
        setSelectedFeed(prev => prev ? (data.find(f => f.id === prev.id) || null) : null);
      });

      const qChats = query(collection(db, 'chats'), orderBy('createdAt', 'asc'));
      unsubChats = onSnapshot(qChats, (snapshot) => {
        const messages = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        setChatMessages(messages);
      });
    };

    const initAuth = () => {
      const { auth, onAuthStateChanged } = window.__auth;
      return onAuthStateChanged(auth, (currentUser) => {
        setUser(currentUser);
      });
    };

    let unsubAuth;

    if (window.__firestore && window.__auth) {
      initFirestore();
      unsubAuth = initAuth();
    } else {
      window.addEventListener('firebase-ready', () => {
        initFirestore();
        unsubAuth = initAuth();
      }, { once: true });
    }

    return () => {
      if (unsubFeeds) unsubFeeds();
      if (unsubChats) unsubChats();
      if (unsubAuth) unsubAuth();
    };
  }, []);

  useEffect(() => {
    if (chatEndRef.current) {
      chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
    }
  }, [chatMessages, activeTab]); // 탭 전환 시에도 스크롤 하단 고정

  const handleSendChatMessage = async (e) => {
    e.preventDefault();
    if (!user) {
      alert("라운지 채팅에 참여하려면 먼저 로그인해 주세요.");
      setAuthMode('login');
      setShowAuthModal(true);
      return;
    }
    if (!user.emailVerified) {
      alert("이메일 인증 링크를 완료한 계정만 라운지 대화 참여가 가능합니다.");
      return;
    }

    const text = chatInput.trim();
    if (!text) return;

    const { db, collection, addDoc } = window.__firestore;
    const username = user.email.split('@')[0];

    try {
      await addDoc(collection(db, 'chats'), {
        user: username,
        text: text,
        createdAt: Date.now()
      });
      setChatInput('');
    } catch (err) {
      console.error("채팅 메시지 전송 실패:", err);
    }
  };

  const togglePlay = () => {
    if (isPlaying) audioRef.current.pause();
    else audioRef.current.play().catch(()=>{});
    setIsPlaying(!isPlaying);
  };

  const openFeed = (feed) => {
    setSelectedFeed(feed);
    setCurrentImgIdx(0);
    setEditingCommentIdx(null);
    setEditingCommentText('');
  };

  const handleAddComment = async (e, feedId) => {
    e.preventDefault();
    if (!user) {
      alert("방명록을 남기려면 먼저 로그인해 주세요.");
      setAuthMode('login');
      setShowAuthModal(true);
      return;
    }
    if (!user.emailVerified) {
      alert("이메일 인증 링크를 완료한 계정만 방명록 참여가 가능합니다.");
      return;
    }

    const text = (commentInputs[feedId] || "").trim();
    if (!text) return;

    const { db, doc, updateDoc, arrayUnion } = window.__firestore;
    const username = user.email.split('@')[0];
    const newComment = { user: username, text, createdAt: Date.now() };

    try {
      await updateDoc(doc(db, 'feeds', feedId), {
        comments: arrayUnion(newComment)
      });
      setCommentInputs({ ...commentInputs, [feedId]: "" });
    } catch(err) {
      console.error(err);
    }
  };

  const handleSignIn = (e) => {
    e.preventDefault();
    const { auth, signInWithEmailAndPassword } = window.__auth;
    signInWithEmailAndPassword(auth, authEmail, authPassword)
      .then((userCredential) => {
        if (!userCredential.user.emailVerified) {
          alert("⚠️ 아직 이메일 인증이 완료되지 않은 계정입니다.");
        } else {
          alert("재즈바 공간에 정상적으로 입장했습니다.");
        }
        closeAuthModal();
      })
      .catch(err => alert(`로그인 실패: 이메일 또는 비밀번호를 다시 확인하세요.`));
  };

  const handleSignUp = (e) => {
    e.preventDefault();
    const { auth, createUserWithEmailAndPassword, sendEmailVerification } = window.__auth;
    createUserWithEmailAndPassword(auth, authEmail, authPassword)
      .then((userCredential) => {
        sendEmailVerification(userCredential.user)
          .then(() => {
            alert("✉️ 인증 링크 메일이 발송되었습니다! 인증 후 로그인해 주세요.");
            window.__auth.signOut(auth);
            setAuthMode('login');
          });
      })
      .catch(err => alert(`회원가입 실패: ${err.message}`));
  };

  const handleResetPw = (e) => {
    e.preventDefault();
    if (!authEmail) return;
    const { auth, sendPasswordResetEmail } = window.__auth;
    sendPasswordResetEmail(auth, authEmail)
      .then(() => { alert("✉️ 비밀번호 재변경 링크 메일을 보냈습니다."); setAuthMode('login'); })
      .catch(err => alert(err.message));
  };

  const handleSignOut = () => {
    const { auth, signOut } = window.__auth;
    signOut(auth).then(() => alert("공간에서 로그아웃 처리되었습니다."));
  };

  const closeAuthModal = () => {
    setShowAuthModal(false);
    setAuthEmail('');
    setAuthPassword('');
    setIdFindGuide('');
  };

  const currentUsername = user ? user.email.split('@')[0] : '';

  return (
    <div className="h-full flex flex-col justify-between relative">
      <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] rounded-full bg-gradient-to-br from-jazzRed via-jazzOrange to-transparent opacity-15 blur-[160px] pointer-events-none z-0"></div>
      <audio ref={audioRef} src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" loop />

      {/* 헤더 */}
      <header className="w-full py-5 px-6 relative bg-jazzBlack/40 backdrop-blur-md z-20 border-b border-zinc-900/40 flex items-center justify-between">
        <div className="w-16"></div>
        <div className="text-center">
          <h1 className="text-xl font-light tracking-[0.3em] text-white">PHILL</h1>
          <p className="text-[10px] tracking-widest text-zinc-500 mt-0.5 uppercase">Online bar & Quiet space</p>
        </div>
        <div className="w-16 text-right">
          {user ? (
            <button onClick={handleSignOut} className="text-[10px] tracking-wider text-zinc-500 hover:text-white transition uppercase">Logout</button>
          ) : (
            <button onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} className="text-[10px] tracking-wider text-jazzOrange hover:text-white transition uppercase">Login</button>
          )}
        </div>
      </header>

      {/* 메인 컴포넌트 */}
      <main className="flex-1 flex items-center justify-center p-3 md:p-4 z-10 overflow-hidden">
        <div className="w-full max-w-[980px] h-full md:h-[580px] bg-jazzCard/65 backdrop-blur-xl rounded-2xl border border-zinc-800/30 shadow-2xl flex flex-col md:flex-row overflow-hidden">
          
          {/* 1. 게시판 영역 (데스크탑에선 항상 노출, 모바일에선 activeTab이 'archive'일 때만 노출) */}
          <div className={`w-full md:w-[60%] h-full p-4 flex flex-col md:border-r border-zinc-900/60 ${activeTab === 'archive' ? 'flex' : 'hidden md:flex'}`}>
            <div className="mb-2 px-1 flex items-center gap-2">
              <span className="text-[10px] tracking-widest text-zinc-400 uppercase font-light">SOUND ARCHIVE</span>
            </div>
            <div className="flex-1 overflow-y-auto pr-1 feed-scroll-container grid grid-cols-2 sm:grid-cols-3 gap-2 rounded-lg">
              {loading && (
                <div className="col-span-3 h-full flex flex-col items-center justify-center text-zinc-600 text-xs font-light tracking-widest gap-2 py-32">
                  <i className="fa-solid fa-xs fa-circle-nodes animate-pulse"></i>
                  <span>LOADING SOUNDS...</span>
                </div>
              )}
              {!loading && feeds.map((feed) => {
                const imgList = feed.coverImage ? feed.coverImage.split('\n').filter(Boolean) : [];
                const hasImg = imgList.length > 0;
                const hasVideo = !!feed.youtubeId;

                return (
                  <div key={feed.id} onClick={() => openFeed(feed)} className="group relative aspect-square bg-zinc-950 rounded-md overflow-hidden cursor-pointer border border-zinc-800/40 hover:border-jazzRed/50 transition duration-300">
                    {hasImg ? (
                      <img src={imgList[0]} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition" />
                    ) : hasVideo ? (
                      <div className="w-full h-full flex flex-col items-center justify-center bg-gradient-to-b from-zinc-900 to-black p-2 text-center">
                        <i className="fa-brands fa-youtube text-xl text-jazzRed mb-1 animate-pulse"></i>
                        <span className="text-[8px] uppercase tracking-widest text-zinc-500 font-medium">YOUTUBE Loop</span>
                      </div>
                    ) : (
                      <div className="w-full h-full p-2 flex items-center justify-center text-center bg-zinc-900 text-[10px] font-light text-zinc-400 leading-relaxed overflow-hidden">
                        <p className="line-clamp-4 text-ellipsis">{feed.bio}</p>
                      </div>
                    )}
                    {imgList.length > 1 && <div className="absolute top-1.5 right-1.5 text-[9px] bg-black/60 px-1 py-0.5 rounded text-zinc-400"><i className="fa-solid fa-layer-group"></i></div>}
                    <div className="absolute inset-0 bg-black/70 flex flex-col justify-end p-2 opacity-0 group-hover:opacity-100 transition-opacity">
                      <h3 className="text-[11px] text-white truncate capitalize">{feed.title || 'Untitled'}</h3>
                      <p className="text-[9px] text-jazzOrange truncate font-light">{feed.artistName || 'Phill Session'}</p>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 2. 실시간 라운지 채팅 영역 (데스크탑에선 항상 노출, 모바일에선 activeTab이 'lounge'일 때만 노출) */}
          <div className={`w-full md:w-[40%] h-full flex flex-col justify-between bg-black/15 ${activeTab === 'lounge' ? 'flex' : 'hidden md:flex'}`}>
            <div className="p-4 border-b border-zinc-900/50 flex items-center justify-between bg-black/20">
              <div className="flex items-center gap-2">
                <span className="w-1.5 h-1.5 rounded-full bg-jazzRed animate-pulse"></span>
                <span className="text-[10px] tracking-widest text-zinc-300 uppercase font-light">Lounge Live Stream</span>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-3 feed-scroll-container">
              {chatMessages.length === 0 ? (
                <div className="h-full flex items-center justify-center text-zinc-600 text-[10px] font-light tracking-widest text-center">
                  BAR LOUNGE IS QUIET.<br/>LEAVE A NOTE FIRST.
                </div>
              ) : (
                chatMessages.map((msg) => (
                  <div key={msg.id} className="text-[11px] leading-relaxed bg-zinc-950/30 p-2 rounded border border-zinc-900/10">
                    <div className="flex items-center justify-between mb-0.5">
                      <span className={`font-medium ${msg.user === currentUsername ? 'text-jazzRed' : 'text-jazzOrange'}`}>
                        {msg.user}
                      </span>
                      <span className="text-[8px] text-zinc-600 font-light">
                        {msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}
                      </span>
                    </div>
                    <span className="text-zinc-300 font-light break-all">{msg.text}</span>
                  </div>
                ))
              )}
              <div ref={chatEndRef} />
            </div>

            <form onSubmit={handleSendChatMessage} className="p-3 border-t border-zinc-900/50 flex gap-2 bg-jazzBlack/40 backdrop-blur-md mb-[56px] md:mb-0">
              <input 
                type="text" 
                placeholder={user ? "공간에 어울리는 이야기를 나누어주세요..." : "로그인 후 대화에 참여해보세요."}
                value={chatInput}
                onChange={(e) => setChatInput(e.target.value)}
                disabled={!user}
                className="flex-grow bg-zinc-950/80 border border-zinc-800/80 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-jazzRed font-light disabled:opacity-40"
              />
              <button type="submit" disabled={!user} className="bg-jazzRed text-white text-xs px-3.5 py-2 rounded font-medium hover:bg-red-700 transition disabled:opacity-40">
                <i className="fa-solid fa-paper-plane text-[10px]"></i>
              </button>
            </form>
          </div>

        </div>
      </main>

      {/* 📱 모바일 하단 전용 내비게이션 탭 바 (데스크탑 hidden, 모바일 flex) */}
      <div className="md:hidden fixed bottom-[53px] left-0 right-0 h-[48px] bg-jazzCard/90 backdrop-blur-lg border-t border-zinc-900 flex z-30">
        <button 
          onClick={() => setActiveTab('archive')} 
          className={`flex-1 flex flex-col items-center justify-center gap-0.5 text-[10px] tracking-widest uppercase transition ${activeTab === 'archive' ? 'text-jazzRed font-medium' : 'text-zinc-600'}`}
        >
          <i className="fa-solid fa-compact-disc text-xs"></i>
          <span>Sounds</span>
        </button>
        <div className="w-[1px] h-6 bg-zinc-900 my-auto"></div>
        <button 
          onClick={() => setActiveTab('lounge')} 
          className={`flex-1 flex flex-col items-center justify-center gap-0.5 text-[10px] tracking-widest uppercase transition ${activeTab === 'lounge' ? 'text-jazzOrange font-medium' : 'text-zinc-600'}`}
        >
          <div className="relative">
            <i className="fa-solid fa-comments text-xs"></i>
            <span className="absolute -top-1 -right-2 w-1 h-1 rounded-full bg-jazzRed animate-pulse"></span>
          </div>
          <span>Lounge</span>
        </button>
      </div>

      {/* 푸터 */}
      <footer className="w-full py-4 border-t border-zinc-900/50 bg-jazzBlack/80 backdrop-blur-md z-20">
        <div className="max-w-xl mx-auto px-6 flex justify-between items-center">
          <div className="flex items-center space-x-3">
            <div className={`w-1.5 h-1.5 rounded-full ${isPlaying ? 'bg-jazzRed animate-pulse' : 'bg-zinc-700'}`}></div>
            <p className="text-xs text-zinc-400 font-light tracking-wide">
              {user ? `Audience: ${user.email.split('@')[0]}` : isPlaying ? "Streaming Radio Session..." : "Radio Muted"}
            </p>
          </div>
          <button onClick={togglePlay} className="text-[11px] tracking-[0.2em] text-zinc-400 hover:text-white transition flex items-center gap-2">
            <span>{isPlaying ? 'TURN OFF' : 'LISTEN NOW'}</span>
            <span className="text-xs">{isPlaying ? '■' : '▶'}</span>
          </button>
        </div>
      </footer>

      {/* 인증 모달 */}
      {showAuthModal && (
        <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="relative w-full max-w-sm bg-jazzCard rounded-2xl border border-zinc-800 p-8 shadow-2xl text-center space-y-5">
            <button onClick={closeAuthModal} className="absolute top-4 right-4 text-zinc-500 hover:text-white text-sm"><i className="fa-times fa-solid"></i></button>
            {authMode === 'login' && (
              <>
                <h2 className="text-xs tracking-[0.25em] text-white uppercase font-light">Jazzbar Access Space</h2>
                <form onSubmit={handleSignIn} className="space-y-3 pt-2">
                  <input type="email" placeholder="이메일 계정" value={authEmail} onChange={e=>setAuthEmail(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs text-white focus:outline-none focus:border-jazzRed font-light" required />
                  <input type="password" placeholder="비밀번호" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs text-white focus:outline-none focus:border-jazzRed font-light" required />
                  <button type="submit" className="w-full bg-jazzRed text-white text-xs py-2.5 rounded font-medium hover:bg-red-700 transition">SIGN IN</button>
                </form>
                <div className="flex justify-between text-[11px] text-zinc-600 px-1 pt-1">
                  <button onClick={() => setAuthMode('register')} className="hover:text-zinc-400 transition">회원가입</button>
                  <div className="space-x-2">
                    <button onClick={() => { setAuthMode('findId'); setIdFindGuide(''); }} className="hover:text-zinc-400 transition">아이디 찾기</button>
                    <span>|</span>
                    <button onClick={() => setAuthMode('findPw')} className="hover:text-zinc-400 transition">비밀번호 재설정</button>
                  </div>
                </div>
              </>
            )}
            {authMode === 'register' && (
              <>
                <h2 className="text-xs tracking-[0.25em] text-jazzOrange uppercase font-light">Create Guest Account</h2>
                <form onSubmit={handleSignUp} className="space-y-3 pt-1">
                  <input type="email" placeholder="이메일 주소 입력" value={authEmail} onChange={e=>setAuthEmail(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs text-white focus:outline-none focus:border-jazzOrange font-light" required />
                  <input type="password" placeholder="비밀번호 (6자 이상)" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs text-white focus:outline-none focus:border-jazzOrange font-light" minLength="6" required />
                  <button type="submit" className="w-full bg-jazzOrange text-black text-xs py-2.5 rounded font-semibold hover:bg-amber-600 transition">인증 이메일 승인 및 가입</button>
                </form>
                <button onClick={() => setAuthMode('login')} className="text-xs text-zinc-500 hover:text-white transition block mx-auto pt-2">이전으로 돌아가기</button>
              </>
            )}
            {authMode === 'findId' && (
              <>
                <h2 className="text-xs tracking-[0.25em] text-zinc-400 uppercase font-light">Account Identification</h2>
                <div className="bg-zinc-950 p-4 rounded border border-zinc-900 text-left text-xs text-zinc-400 leading-relaxed font-light">
                  {idFindGuide || "보안 정책상 가입 이메일의 로우 리스트 데이터는 임의 제공되지 않습니다."}
                </div>
                {!idFindGuide && <button onClick={() => setIdFindGuide("💡 수신 메일함에서 'phill-bar' 발송 기록을 찾아보세요.")} className="w-full bg-zinc-800 text-white text-xs py-2 rounded font-light hover:bg-zinc-700">식별 가이드 보기</button>}
                <button onClick={() => setAuthMode('login')} className="text-xs text-zinc-500 hover:text-white transition block mx-auto pt-2">로그인 화면으로</button>
              </>
            )}
            {authMode === 'findPw' && (
              <>
                <h2 className="text-xs tracking-[0.25em] text-zinc-400 uppercase font-light">Reset Password</h2>
                <form onSubmit={handleResetPw} className="space-y-3 pt-1">
                  <input type="email" placeholder="이메일 주소 입력" value={authEmail} onChange={e=>setAuthEmail(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs text-white focus:outline-none font-light" required />
                  <button type="submit" className="w-full bg-zinc-800 text-zinc-300 hover:text-white text-xs py-2.5 rounded font-medium transition">변경 확인 이메일 전송</button>
                </form>
                <button onClick={() => setAuthMode('login')} className="text-xs text-zinc-500 hover:text-white transition block mx-auto pt-1">취소</button>
              </>
            )}
          </div>
        </div>
      )}

      {/* 피드 상세 모달 */}
      {selectedFeed && (() => {
        const images = selectedFeed.coverImage ? selectedFeed.coverImage.split('\n').filter(Boolean) : [];
        const hasImg = images.length > 0;
        const hasVideo = !!selectedFeed.youtubeId;

        const HiddenAudio = hasVideo ? (
          <div className="yt-hidden-player">
            <iframe src={`https://www.youtube.com/embed/${selectedFeed.youtubeId}?autoplay=1&mute=0&loop=1&playlist=${selectedFeed.youtubeId}&start=${selectedFeed.startTime || 0}&end=${selectedFeed.endTime || 0}&controls=0`} title="YT" frameBorder="0" width="1" height="1"></iframe>
          </div>
        ) : null;

        return (
          <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4 md:p-6">
            <div className="relative w-full max-w-[850px] bg-jazzCard rounded-2xl border border-zinc-800 overflow-hidden flex flex-col md:flex-row shadow-2xl" style={{maxHeight:'90vh'}}>
              <button onClick={() => setSelectedFeed(null)} className="absolute top-4 right-4 z-10 w-8 h-8 flex items-center justify-center rounded-full bg-zinc-900/80 border border-zinc-700 text-zinc-300 hover:text-white transition"><i className="fa-times fa-solid text-xs"></i></button>
              <div className="w-full md:w-1/2 aspect-square flex-shrink-0 bg-black relative">
                {HiddenAudio}
                {hasImg ? <img src={images[currentImgIdx]} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-xs text-zinc-600 font-mono">AUDIO SESSION</div>}
              </div>
              <div className="flex flex-col justify-between bg-jazzBlack p-4 md:p-6 w-full md:w-1/2 overflow-hidden">
                <div className="flex flex-col gap-3 md:gap-4 flex-1 overflow-hidden">
                  <div>
                    <h2 className="text-lg md:text-xl font-light text-white truncate capitalize">{selectedFeed.title || 'Untitled'}</h2>
                    <p className="text-xs text-zinc-500 font-light mt-0.5">{selectedFeed.artistName || 'Phill Session'}</p>
                  </div>
                  <div className="flex-1 overflow-y-auto pr-1 feed-scroll-container text-xs text-zinc-400 font-light leading-relaxed whitespace-pre-wrap py-2 border-t border-b border-zinc-900/60">
                    {selectedFeed.bio || <span className="text-zinc-700 italic">소개가 없습니다.</span>}
                  </div>
                  <div className="h-20 md:h-24 overflow-y-auto feed-scroll-container space-y-2 text-[11px]">
                    {(selectedFeed.comments || []).map((c, i) => (
                      <div key={i} className="bg-zinc-950/40 p-2 rounded border border-zinc-900/30">
                        <span className="font-medium text-jazzOrange mr-1.5">{c.user}</span>
                        <span className="text-zinc-400 font-light">{c.text}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <form onSubmit={(e) => handleAddComment(e, selectedFeed.id)} className="flex gap-2 pt-3 border-t border-zinc-900/60">
                  <input type="text" placeholder="방명록을 남겨주세요..." value={commentInputs[selectedFeed.id] || ""} onChange={(e) => setCommentInputs({ ...commentInputs, [selectedFeed.id]: e.target.value })} className="flex-grow bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 text-xs text-white focus:outline-none" />
                  <button type="submit" className="bg-jazzRed text-white text-[11px] px-3 py-1.5 rounded">게시</button>
                </form>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
