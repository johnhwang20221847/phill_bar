<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phill | Online Jazzbar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght=200;300;400;500&family=Noto+Sans+KR:wght=300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, onSnapshot, query, orderBy, arrayUnion, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  const firebaseConfig = { apiKey: "AIzaSyADaeEPaUvLyU6J8eIPIy9luNeDhizxg-Q", authDomain: "phill-bar.firebaseapp.com", projectId: "phill-bar", storageBucket: "phill-bar.firebasestorage.app", messagingSenderId: "298800907820", appId: "1:298800907820:web:98b360862cf2b0c6deb389", measurementId: "G-BHQEZYV429" };
  const app = initializeApp(firebaseConfig);
  window.__firestore = { db: getFirestore(app), collection, getDocs, doc, updateDoc, onSnapshot, query, orderBy, arrayUnion, addDoc };
  window.__auth = { auth: getAuth(app), createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail };
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<script>
tailwind.config = { theme: { extend: { colors: { jazzBlack: '#060202', jazzCard: '#120A0A', jazzRed: '#FF2A1A', jazzOrange: '#FFA100' } } } }
</script>
<style>
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #FF2A1A; border-radius: 4px; }
.feed-scroll-container { scrollbar-width: thin; scrollbar-color: #FF2A1A transparent; }
.yt-hidden-player { position: absolute; width: 1px; height: 1px; top: 0; left: 0; opacity: 0; pointer-events: none; }
</style>
</head>
<body class="bg-jazzBlack text-zinc-300">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [feeds, setFeeds] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedFeed, setSelectedFeed] = useState(null);
  const [currentImgIdx, setCurrentImgIdx] = useState(0);
  const [user, setUser] = useState(null);
  const [chatMessages, setChatMessages] = useState([]);
  const [chatInput, setChatInput] = useState('');
  const [activeTab, setActiveTab] = useState('archive'); // 탭 상태

  // Firebase 및 기존 로직 로드
  useEffect(() => {
    const init = () => {
      const { db, collection, query, orderBy, onSnapshot } = window.__firestore;
      const { auth, onAuthStateChanged } = window.__auth;
      onSnapshot(query(collection(db, 'feeds'), orderBy('createdAt', 'desc')), (s) => { setFeeds(s.docs.map(d=>({id:d.id, ...d.data()}))); setLoading(false); });
      onSnapshot(query(collection(db, 'chats'), orderBy('createdAt', 'asc')), (s) => setChatMessages(s.docs.map(d=>({id:d.id, ...d.data()}))));
      onAuthStateChanged(auth, setUser);
    };
    window.__firestore ? init() : window.addEventListener('firebase-ready', init);
  }, []);

  return (
    <div className="min-h-screen flex flex-col">
      <header className="py-6 text-center border-b border-zinc-900">
        <h1 className="text-xl font-light tracking-[0.3em] text-white">PHILL</h1>
      </header>

      {/* 탭 네비게이션 */}
      <nav className="flex justify-center gap-8 py-4 bg-jazzBlack">
        {['archive', 'lounge', 'picks'].map((tab) => (
          <button key={tab} onClick={() => setActiveTab(tab)} 
            className={`text-[10px] uppercase tracking-widest transition ${activeTab === tab ? 'text-jazzRed' : 'text-zinc-600'}`}>
            {tab}
          </button>
        ))}
      </nav>

      <main className="flex-1 w-full max-w-[980px] mx-auto p-4">
        <div className="bg-jazzCard/65 rounded-2xl border border-zinc-800 h-[600px] overflow-hidden">
          
          {/* 1. 아카이브 탭 */}
          {activeTab === 'archive' && (
            <div className="p-4 grid grid-cols-2 gap-3 h-full overflow-y-auto">
              {!loading && feeds.map(feed => (
                <div key={feed.id} onClick={() => setSelectedFeed(feed)} className="aspect-square bg-zinc-900 rounded-xl cursor-pointer hover:border-jazzRed border border-transparent transition">
                  {feed.coverImage ? <img src={feed.coverImage.split('\n')[0]} className="w-full h-full object-cover rounded-xl" /> : <div className="h-full flex items-center justify-center text-[10px]">NO IMAGE</div>}
                </div>
              ))}
            </div>
          )}

          {/* 2. 라운지 탭 */}
          {activeTab === 'lounge' && (
            <div className="h-full flex flex-col p-4">
              <div className="flex-1 overflow-y-auto space-y-2 mb-4">
                {chatMessages.map(msg => <div key={msg.id} className="text-xs">{msg.user}: {msg.text}</div>)}
              </div>
            </div>
          )}

          {/* 3. 뮤직 픽 탭 */}
          {activeTab === 'picks' && (
            <div className="h-full flex items-center justify-center text-zinc-500">
              <p className="text-xs uppercase tracking-widest">Music Pick Contents</p>
            </div>
          )}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
